<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aşkify</title>
<style>
  :root{
    --bg:#fbeef2; --bg2:#f7e2ea; --card:#fffaf9; --card2:#fdeef2;
    --ink:#4a2e38; --ink-dim:#9a7482; --rose:#e0839c; --rose-dark:#c4607d;
    --lav:#c9a8d9; --border:#f0cdd9; --gold:#e8b978;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#231620; --bg2:#2c1c28; --card:#2f1e2a; --card2:#3a2531;
      --ink:#f5e3ea; --ink-dim:#c79cae; --border:#4a2f3d;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--ink); font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%; display:flex; justify-content:center;
  }
  .app{ width:100%; max-width:420px; padding:22px 18px 32px; position:relative; }
  .title{ text-align:center; margin:6px 0 2px; }
  .title h1{ font-size:1.6rem; margin:0; color:var(--rose-dark); font-weight:600; }
  .title p{ margin:6px 0 0; font-size:.92rem; color:var(--ink-dim); font-style:italic; }

  .avatar-wrap{ display:flex; justify-content:center; margin:22px 0 10px; }
  #avatar{ image-rendering:pixelated; width:260px; height:auto; filter:drop-shadow(0 8px 16px rgba(196,96,125,.25)); }

  .now{ text-align:center; margin:6px 0 18px; min-height:44px; }
  .now .song{ font-size:1.05rem; font-weight:600; color:var(--ink); }
  .now .empty{ color:var(--ink-dim); font-size:.9rem; }

  .player{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:0 6px 20px rgba(196,96,125,.12);
  }
  .progress-track{
    height:5px; background:var(--card2); border-radius:3px; cursor:pointer; margin-bottom:12px;
  }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--rose),var(--lav)); border-radius:3px; width:0%; }
  .times{ display:flex; justify-content:space-between; font-size:.7rem; color:var(--ink-dim); margin:-8px 0 12px; font-family:ui-monospace,monospace; }

  .controls{ display:flex; align-items:center; justify-content:center; gap:18px; }
  .ctrl-btn{
    background:none; border:none; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:6px;
  }
  .ctrl-btn svg{ width:22px; height:22px; }
  #playBtn{
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(145deg,var(--rose),var(--rose-dark));
    color:#fff; box-shadow:0 4px 14px rgba(196,96,125,.4);
  }
  #playBtn svg{ width:22px; height:22px; }

  .playlist{ margin-top:20px; }
  .pl-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .pl-head h2{ font-size:.78rem; letter-spacing:.06em; color:var(--ink-dim); margin:0; font-weight:600; }
  #addBtn{
    background:var(--card2); border:1px solid var(--border); color:var(--rose-dark);
    padding:5px 12px; border-radius:20px; font-size:.78rem; cursor:pointer;
  }
  #fileInput{ display:none; }
  #list{ display:flex; flex-direction:column; gap:6px; }
  .track{
    display:flex; align-items:center; gap:10px; padding:9px 10px;
    background:var(--card); border:1px solid var(--border); border-radius:10px; cursor:pointer;
  }
  .track.active{ border-color:var(--rose); background:var(--card2); }
  .track .num{ font-size:.75rem; color:var(--ink-dim); font-family:ui-monospace,monospace; width:16px; }
  .track .name{ flex:1; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track .del{ color:var(--ink-dim); opacity:.6; font-size:.85rem; padding:2px 6px; }
  .empty-list{ text-align:center; color:var(--ink-dim); font-size:.85rem; padding:26px 10px; }
  .note{ text-align:center; font-size:.72rem; color:var(--ink-dim); margin-top:16px; line-height:1.5; }


  #pls{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; }
  .chip{ flex:none; display:flex; align-items:center; gap:6px; padding:4px 12px 4px 4px; background:var(--card); border:1px solid var(--border); border-radius:24px; cursor:pointer; font-size:.8rem; color:var(--ink); white-space:nowrap; }
  .chip.active{ border-color:var(--rose); background:var(--card2); }
  .chip.plus{ padding:6px 12px; color:var(--rose-dark); }
  .chip .cv{ width:26px; height:26px; border-radius:50%; background:var(--card2) center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:.8rem; }
  #plHead{ display:none; align-items:center; gap:12px; margin-bottom:10px; }
  #plHead .big{ width:64px; height:64px; border-radius:12px; background:var(--card2) center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
  #plHead .nm{ flex:1; font-weight:600; }
  .mini{ background:var(--card2); border:1px solid var(--border); color:var(--rose-dark); padding:4px 10px; border-radius:14px; font-size:.75rem; cursor:pointer; }
  .track .add{ color:var(--rose-dark); font-size:1.1rem; padding:0 6px; }
  .track .rm{ color:var(--ink-dim); opacity:.6; font-size:.85rem; padding:2px 6px; }
  #sheet{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:flex-end; justify-content:center; z-index:55; }
  #sheet .box{ width:100%; max-width:420px; background:var(--card); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); max-height:70%; overflow:auto; }
  #sheet h3{ margin:0 0 10px; font-size:.9rem; color:var(--ink-dim); }
  #sheet button{ display:block; width:100%; text-align:left; margin-top:6px; padding:10px; background:var(--card2); border:1px solid var(--border); border-radius:10px; color:var(--ink); font:inherit; font-size:.9rem; cursor:pointer; }

  .ctrl-btn.on{ color:var(--rose-dark); background:var(--card2); border-radius:50%; box-shadow:0 0 0 1.5px var(--rose) inset; }
  #dlg{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:60; padding:18px; }
  #dlg .card{ width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:22px 20px 18px; box-shadow:0 12px 40px rgba(0,0,0,.25); max-height:100%; overflow:auto; }
  #dlg h3{ margin:0 0 14px; color:var(--rose-dark); font-size:1.1rem; font-weight:600; }
  #dlg label{ display:block; margin:14px 0 6px; font-size:.8rem; color:var(--ink-dim); }
  #dlg .hint{ margin:0 0 4px; font-size:.85rem; color:var(--ink-dim); line-height:1.5; }
  #dlg input[type=text], #sheet input[type=text]{ width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; background:var(--bg); color:var(--ink); font:inherit; font-size:1rem; outline:none; }
  #dlg input[type=text]:focus, #sheet input[type=text]:focus{ border-color:var(--rose); }
  #dlg input.bad{ border-color:#d64545; }
  #dlg .cvrow{ display:flex; align-items:center; gap:12px; }
  #dlg .cvprev{ width:64px; height:64px; border-radius:12px; background:var(--card2) center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--ink-dim); }
  #dlg .row{ display:flex; gap:10px; margin-top:20px; }
  #dlg .btn{ flex:1; padding:11px 14px; border-radius:12px; border:1px solid var(--border); font:inherit; font-size:.92rem; cursor:pointer; }
  #dlg .cvrow .btn{ flex:none; }
  #dlg .btn.sec{ background:var(--card2); color:var(--ink); }
  #dlg .btn.pri{ background:linear-gradient(145deg,var(--rose),var(--rose-dark)); color:#fff; border-color:transparent; }
  #dlg .btn.danger{ display:block; width:100%; margin-top:12px; background:none; border:none; color:#c0392b; font-size:.82rem; }
  #sheet .box.pick{ display:flex; flex-direction:column; max-height:85%; overflow:hidden; }
  #sheet .plist{ overflow:auto; flex:1; margin:10px 0; }
  #sheet .prow{ display:flex; align-items:center; gap:10px; padding:10px; margin-top:6px; background:var(--card2); border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:.9rem; }
  #sheet .prow.on{ border-color:var(--rose); }
  #sheet .prow .tick{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-size:.8rem; }
  #sheet .prow.on .tick{ background:var(--rose-dark); border-color:var(--rose-dark); }
  #sheet .prow .pn{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sheet .pfoot button.done{ background:linear-gradient(145deg,var(--rose),var(--rose-dark)); color:#fff; border-color:transparent; text-align:center; }
  #sheet .pfoot button.cancel{ text-align:center; }
  #avatar{ cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .track .grip{ touch-action:none; cursor:grab; color:var(--ink-dim); font-size:1.15rem; padding:2px 8px; user-select:none; -webkit-user-select:none; }
  .track .gdel{ color:var(--ink-dim); opacity:.75; font-size:.85rem; padding:2px 6px; }
  .track.shifting{ transition:transform .15s; }
  .track.dragging{ position:relative; z-index:5; box-shadow:0 8px 20px rgba(196,96,125,.35); transition:none; }
  #dayc{ position:absolute; top:22px; left:18px; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; line-height:1.15; padding:6px 10px; max-width:112px; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 3px 10px rgba(196,96,125,.15); cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #dayc .n{ font-size:.95rem; font-weight:700; color:var(--rose-dark); }
  #dayc .l{ font-size:.62rem; color:var(--ink-dim); margin-top:2px; }
  #dayc.special{ background:linear-gradient(145deg,var(--rose),var(--lav)); border-color:transparent; animation:dpulse 2.4s ease-in-out infinite; }
  #dayc.special .n, #dayc.special .l{ color:#fff; }
  @keyframes dpulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  #albBtn{ position:absolute; top:22px; right:18px; z-index:2; width:40px; height:40px; padding:0; border-radius:14px; border:1px solid var(--border); background:var(--card); box-shadow:0 3px 10px rgba(196,96,125,.15); font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
  #album{ display:none; position:fixed; inset:0; z-index:30; flex-direction:column; background:linear-gradient(180deg,var(--bg),var(--bg2)); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color:var(--ink); }
  .alb-head{ display:flex; align-items:center; gap:8px; padding:14px 14px 8px; max-width:640px; width:100%; margin:0 auto; }
  .alb-title{ flex:1; font-size:1.15rem; font-weight:600; color:var(--rose-dark); }
  #albMsg{ text-align:center; font-size:.8rem; color:var(--ink-dim); padding:2px 14px; min-height:1.3em; }
  #albBody{ flex:1; overflow:auto; padding:6px 10px 24px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  #albGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:640px; margin:0 auto; }
  .alb-cell{ aspect-ratio:1; background:var(--card2); border-radius:8px; overflow:hidden; cursor:pointer; }
  .alb-cell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .alb-empty{ grid-column:1/-1; text-align:center; color:var(--ink-dim); font-size:.9rem; padding:40px 10px; line-height:1.6; }
  #viewer{ display:none; position:fixed; inset:0; z-index:40; background:#000; align-items:center; justify-content:center; touch-action:pan-y; }
  #vImg{ max-width:100%; max-height:100%; object-fit:contain; transition:opacity .15s; }
  #viewer button{ position:absolute; background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:50%; width:44px; height:44px; padding:0; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #vClose{ top:calc(12px + env(safe-area-inset-top,0px)); right:12px; }
  #vDel{ top:calc(12px + env(safe-area-inset-top,0px)); left:12px; }
  #vPrev{ left:8px; top:50%; margin-top:-22px; }
  #vNext{ right:8px; top:50%; margin-top:-22px; }
  #vCount{ position:absolute; bottom:calc(14px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; color:#fff; font-size:.8rem; opacity:.8; }
  #albBtn{ width:auto; padding:0 12px; gap:6px; font-size:.85rem; font-weight:600; color:var(--rose-dark); font-family:inherit; }
  .alb-title{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .alb-cell{ position:relative; }
  .alb-cell.folder{ border:1px solid var(--border); }
  .alb-cell.folder img{ filter:brightness(.8); }
  .alb-cell .fname{ position:absolute; left:0; right:0; bottom:0; padding:16px 7px 5px; background:linear-gradient(transparent,rgba(0,0,0,.65)); color:#fff; font-size:.72rem; line-height:1.2; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .alb-cell .ficon{ position:absolute; top:5px; left:7px; font-size:1rem; }
  .alb-cell.nocover{ display:flex; align-items:center; justify-content:center; }
  .alb-cell.nocover .bigicon{ font-size:2rem; margin-bottom:10px; }
  .alb-cell.nocover .fname{ background:none; color:var(--ink); }
  #vMove{ top:calc(12px + env(safe-area-inset-top,0px)); left:66px; }
  @media (max-width:400px){ .title h1{ font-size:1.3rem; } #dayc{ max-width:100px; } }
  .alb-head{ gap:6px; }
  .alb-head .mini{ padding:4px 8px; }
  #dayc .l:empty{ display:none; }
  .vol{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; }
  .vol input{ flex:1; max-width:240px; accent-color:var(--rose); }
  #volIcon{ font-size:1rem; width:1.4rem; text-align:center; }
  html{ height:auto; min-height:100%; }
  body{ height:auto; min-height:100vh; min-height:100dvh; }
  #list.lim{ max-height:min(55vh,440px); overflow-y:auto; overscroll-behavior:contain; padding-right:4px; scrollbar-width:thin; scrollbar-color:var(--rose) transparent; }
  #list.lim .track{ flex-shrink:0; }
  .srow{ display:flex; gap:8px; margin-bottom:8px; }
  .srow input{ flex:1; min-width:0; padding:8px 12px; border:1.5px solid var(--border); border-radius:12px; background:var(--card); color:var(--ink); font:inherit; font-size:.9rem; outline:none; }
  .srow input:focus{ border-color:var(--rose); }
  .srow .mini{ white-space:nowrap; }
  .lastlist{ margin:12px 0; color:var(--ink-dim); font-size:.9rem; }
  .lrow{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .lrow .ln{ color:var(--ink); }
  .lrow .lt{ color:var(--ink-dim); font-size:.75rem; white-space:nowrap; }
  .pgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .pgrid .empty-list{ grid-column:1/-1; }
  .pcell{ position:relative; aspect-ratio:1; background:var(--card2); border-radius:8px; overflow:hidden; cursor:pointer; }
  .pcell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ptk{ position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%; border:2px solid #fff; background:rgba(0,0,0,.25); color:#fff; font-size:.75rem; display:flex; align-items:center; justify-content:center; }
  .on .ptk{ background:var(--rose); }
  .pcell.on img, .alb-cell.on img{ opacity:.6; }
  #albBar{ display:flex; gap:8px; max-width:640px; width:100%; margin:0 auto; padding:0 14px 8px; }
  .opts{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 12px; }
  .sw{ width:30px; height:30px; border-radius:50%; border:2px solid var(--border); cursor:pointer; }
  .sw.on{ border-color:var(--rose-dark); box-shadow:0 0 0 2px var(--rose); }
  .mini.on{ background:var(--rose); color:#fff; border-color:var(--rose); }
  #dlg .card{ max-height:88vh; overflow-y:auto; }
  .bgo{ display:flex; flex-direction:column; align-items:center; gap:3px; width:64px; cursor:pointer; }
  .bgo small{ font-size:.62rem; color:var(--ink-dim); text-align:center; }
  :root[data-bg="rose"]{ --bg:#fbeef2; --bg2:#f7e2ea; --card:#fffaf9; --card2:#fdeef2; --ink:#4a2e38; --ink-dim:#9a7482; --border:#f0cdd9; }
  :root[data-bg="dark"]{ --bg:#231620; --bg2:#2c1c28; --card:#2f1e2a; --card2:#3a2531; --ink:#f5e3ea; --ink-dim:#c79cae; --border:#4a2f3d; }
  :root[data-bg="lav"]{ --bg:#f1ecfa; --bg2:#e4daf5; --card:#fbf9ff; --card2:#eee7fa; --ink:#37294f; --ink-dim:#7d6f9a; --border:#d8cdef; }
  :root[data-bg="mint"]{ --bg:#ebf6f0; --bg2:#d9eee3; --card:#f8fdfa; --card2:#e6f4ec; --ink:#2b4a3c; --ink-dim:#6f9683; --border:#c3e2d3; }
  :root[data-bg="sun"]{ --bg:#fdeee2; --bg2:#f9d9d0; --card:#fffaf6; --card2:#fbe6db; --ink:#5a3328; --ink-dim:#a67a6c; --border:#f0cbbd; }
  :root[data-bg="night"]{ --bg:#141c33; --bg2:#1e2748; --card:#1f2848; --card2:#28335a; --ink:#e8ecfa; --ink-dim:#9aa6d0; --border:#34406b; }

</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbeef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231620" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aşkify">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var b=localStorage.getItem('bg');if(b)document.documentElement.dataset.bg=b}catch(e){}</script>
</head>
<body>
<div class="app">
  <button id="albBtn" aria-label="Albüm" title="Albüm">📷 Albüm</button>
  <div id="dayc" title="Dokun: yıl / ay / gün"><span class="n" id="dayN"></span><span class="l" id="dayL"></span></div>
  <div class="title">
    <h1>Aşkify</h1>
    <p>Beni hatırla</p>
  </div>

  <div class="avatar-wrap">
    <svg id="avatar" viewBox="-4 -4 76 52" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"></svg>
  </div>
  <div style="text-align:center;margin:-4px 0 4px"><button class="mini" id="outfitBtn">🎨 Kıyafet ve tema</button> <button class="mini" id="actBtn">💞 Hareketler</button></div>
  <div id="presence" style="text-align:center;font-size:.78rem;color:var(--ink-dim);margin:0 0 6px;min-height:1em"></div>

  <div class="now">
    <div class="song" id="nowSong">—</div>
    <div class="empty" id="nowEmpty">Henüz şarkı eklenmedi</div>
  </div>

  <div class="player">
    <div class="progress-track" id="progTrack"><div class="progress-fill" id="progFill"></div></div>
    <div class="times"><span id="curT">0:00</span><span id="durT">0:00</span></div>
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn" aria-label="Karışık çal" title="Karışık çal">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" aria-label="Önceki">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
      </button>
      <button id="playBtn" aria-label="Oynat">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Sonraki">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" aria-label="Aynı şarkıyı tekrarla" title="Aynı şarkıyı tekrarla">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
      </button>
    </div>
    <div class="vol" id="volRow"><span id="volIcon">🔊</span><input type="range" id="vol" min="0" max="100" value="100" aria-label="Ses"></div>
  </div>

  <div class="playlist">
    <div id="pls"></div>
    <div id="plHead"></div>
    <div class="pl-head">
      <h2>ÇALMA LİSTESİ</h2>
      <button id="addBtn">+ Şarkı ekle</button>
      <input type="file" id="fileInput" accept="audio/*" multiple>
    </div>
    <div class="srow"><input type="search" id="q" placeholder="Şarkı ara…" autocomplete="off"><button class="mini" id="lastBtn">🎧 Son dinlenen</button></div>
    <div id="list"></div>
  </div>

  <div class="note" id="status"></div>
  <div style="text-align:center;margin-top:10px"><button class="mini" id="instBtn">📲 Ana ekrana ekle</button></div>
  <a href="#" id="tokBtn" style="display:none" aria-hidden="true"></a>
</div>

<div id="sheet"></div>
<div id="dlg"></div>
<div id="album">
  <div class="alb-head"><button class="mini" id="albBack" style="display:none" aria-label="Geri">‹</button><div class="alb-title" id="albTitle">Albüm</div><button class="mini" id="albEditBtn" style="display:none" aria-label="Klasörü düzenle">✎</button><button class="mini" id="albFolderBtn">＋ Klasör</button><button class="mini" id="albAdd">＋ Fotoğraf</button><button class="mini" id="albClose" aria-label="Kapat">✕</button></div>
  <div id="albMsg"></div>
  <div id="albBar"><button class="mini" id="albSel">Seç</button><button class="mini" id="albSelDel" style="display:none"></button></div>
  <div id="albBody"><div id="albGrid"></div></div>
  <input type="file" id="albFile" accept="image/*" multiple style="display:none">
</div>
<div id="viewer">
  <img id="vImg" alt="">
  <button id="vClose" aria-label="Kapat">✕</button>
  <button id="vDel" aria-label="Sil">🗑</button>
  <button id="vMove" aria-label="Klasöre taşı">📁</button>
  <button id="vPrev" aria-label="Önceki">‹</button>
  <button id="vNext" aria-label="Sonraki">›</button>
  <div id="vCount"></div>
</div>
<input type="file" id="coverInput" accept="image/*" style="display:none">
<audio id="audio"></audio>

<script>
const BUILTIN = [];
</script>
<script>
(function(){
  const DB_NAME='elif-muzik', STORE='tracks';
  let db;
  function openDB(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{
        req.result.createObjectStore(STORE, {keyPath:'id', autoIncrement:true});
      };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
  }
  function addTrack(name, blob){
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readwrite');
      const req = tx.objectStore(STORE).add({name, blob});
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
  }
  function getAllTracks(){
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
  }
  function deleteTrack(id){
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = ()=>res();
      req.onerror = ()=>rej(req.error);
    });
  }

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const listEl = document.getElementById('list');
  const nowSong = document.getElementById('nowSong');
  const nowEmpty = document.getElementById('nowEmpty');
  const progFill = document.getElementById('progFill');
  const progTrack = document.getElementById('progTrack');
  const curT = document.getElementById('curT');
  const durT = document.getElementById('durT');

  let tracks = [], allTracks = [], playlists = [], curPl = null, curKey = null;
  let currentIndex = -1;
  let shuffleOn = false, repeatOn = false;
  const played = new Set(); const hist = [];
  let objectUrl = null, qTerm = '', listenTimer = null;
  const justUploaded = {}; const deletedNames = new Set();

  function fmt(s){
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m+':'+String(sec).padStart(2,'0');
  }

  function renderList(){
    const st0 = listEl.scrollTop;
    listEl.innerHTML='';
    if(tracks.length===0){
      listEl.innerHTML = '<div class="empty-list">'+(curPl ? 'Bu listede henüz şarkı yok. Sağ üstteki "＋ Şarkı seç" ile ekleyebilirsin.' : 'Henüz şarkı yok — sağ üstten ekleyebilirsin')+'</div>';
      return;
    }
    tracks.forEach((t,i)=>{
      if(qTerm && !t.name.toLocaleLowerCase('tr').includes(qTerm)) return;
      const div = document.createElement('div');
      div.className = 'track'+(i===currentIndex?' active':'');
      div.innerHTML = `<span class="num">${i+1}</span><span class="name">${esc(t.name)}</span>${tailFor(t)}`;
      div.querySelector('.name').onclick = ()=>playTrack(i);
      div.querySelector('.num').onclick = ()=>playTrack(i);
      const delEl = div.querySelector('.del');
      if(delEl) delEl.onclick = async (e)=>{
        e.stopPropagation();
        await deleteTrack(t.id);
        if(i===currentIndex){ audio.pause(); currentIndex=-1; nowSong.textContent='—'; nowEmpty.style.display='block'; setPlayingState(false); }
        await loadTracks();
      };
      const addEl = div.querySelector('.add');
      if(addEl) addEl.onclick = (ev)=>{ ev.stopPropagation(); if(!hasToken()){ document.getElementById('tokBtn').click(); return; } openAddSheet(t); };
      const rmEl = div.querySelector('.rm');
      if(rmEl) rmEl.onclick = (ev)=>{ ev.stopPropagation(); const k=String(t.id); plAction(()=>updatePlaylists(d=>{ const p=d.playlists.find(x=>x.id===curPl); if(p) p.tracks=p.tracks.filter(x=>x!==k); })); };
      const gdEl = div.querySelector('.gdel');
      if(gdEl) gdEl.onclick = (ev)=>{
        ev.stopPropagation();
        confirmDlg('Şarkı silinsin mi?', '“'+t.name+'” depodan silinir ve tüm listelerden de kalkar. Bu işlem sayfadan geri alınamaz.', 'Sil',
          async ()=>{ await plAction(()=>deleteRemote(t)); await loadTracks(); });
      };
      const gripEl = div.querySelector('.grip');
      if(gripEl){ if(qTerm) gripEl.remove(); else attachDrag(gripEl, i); }
      listEl.appendChild(div);
    });
    if(qTerm && !listEl.children.length) listEl.innerHTML = '<div class="empty-list">Eşleşen şarkı yok</div>';
    listEl.scrollTop = st0;
  }

  function attachDrag(grip, i){
    grip.addEventListener('pointerdown', (e)=>{
      if(tracks.length<2) return;
      e.preventDefault(); e.stopPropagation();
      const rows = Array.from(listEl.children), me = rows[i]; if(!me) return;
      const n = rows.length, h = me.getBoundingClientRect().height + 6;
      const y0 = e.clientY, s0 = window.scrollY;
      let lastY = e.clientY, j = i;
      try{ grip.setPointerCapture(e.pointerId); }catch(err){}
      rows.forEach(r=>r.classList.add('shifting')); me.classList.remove('shifting'); me.classList.add('dragging');
      function update(){
        const dy = (lastY - y0) + (window.scrollY - s0);
        me.style.transform = 'translateY('+dy+'px)';
        j = Math.max(0, Math.min(n-1, Math.round(i + dy/h)));
        rows.forEach((r,k)=>{
          if(k===i) return;
          let sh = 0;
          if(k>i && k<=j) sh = -h; else if(k<i && k>=j) sh = h;
          r.style.transform = sh ? 'translateY('+sh+'px)' : '';
        });
      }
      function move(ev){ lastY = ev.clientY; update(); }
      const timer = setInterval(()=>{
        if(lastY<90) window.scrollBy(0,-10); else if(lastY>window.innerHeight-90) window.scrollBy(0,10); else return;
        update();
      }, 16);
      function end(ev){
        clearInterval(timer);
        grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', end); grip.removeEventListener('pointercancel', end);
        rows.forEach(r=>{ r.style.transform=''; r.classList.remove('shifting','dragging'); });
        if(ev.type==='pointercancel' || j===i) return;
        const order = tracks.map(t=>String(t.id)); const moved = order.splice(i,1)[0]; order.splice(j,0,moved);
        const plId = curPl, pl0 = playlists.find(p=>p.id===plId); if(!pl0) return;
        const old = pl0.tracks.slice();
        pl0.tracks = order.concat(pl0.tracks.filter(x=>!order.includes(x)));
        applyView();
        plAction(async ()=>{
          try{
            await updatePlaylists(d=>{
              const p = d.playlists.find(x=>x.id===plId); if(!p) return;
              p.tracks = order.concat(p.tracks.filter(x=>!order.includes(x)));
            });
          }catch(err){ pl0.tracks = old; throw err; }
        });
      }
      grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
    });
  }

  async function loadTracks(){
    allTracks = BUILTIN.concat(await fetchRemote(), await getAllTracks());
    try{ playlists = (await ghGetPlaylists()).data.playlists || []; }catch(e){}
    applyView(); renderPls();
  }

  function playTrack(i, fromPrev){
    if(i<0 || i>=tracks.length) return;
    currentIndex = i;
    const t = tracks[i];
    if(curKey!==null && !fromPrev && curKey!==String(t.id)){ hist.push(curKey); if(hist.length>60) hist.shift(); }
    curKey = String(t.id);
    played.add(curKey);
    if(objectUrl){ URL.revokeObjectURL(objectUrl); objectUrl = null; }
    if(t.builtin){ audio.src = t.url; }
    else { objectUrl = URL.createObjectURL(t.blob); audio.src = objectUrl; }
    audio.play();
    nowSong.textContent = t.name;
    nowEmpty.style.display='none';
    updateMedia(t); spawnBurst(8, 34, 20);
    renderList();
    const act = listEl.querySelector('.track.active');
    if(act){ const lr = listEl.getBoundingClientRect(), ar = act.getBoundingClientRect(); if(ar.top<lr.top || ar.bottom>lr.bottom) listEl.scrollTop += ar.top-lr.top-(listEl.clientHeight-act.offsetHeight)/2; }
    clearTimeout(listenTimer); const lk = curKey;
    listenTimer = setTimeout(()=>{ if(curKey===lk && !audio.paused) logListen(t.name); }, 15000);
  }

  function setPlayingState(playing){
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    avatarDancing = playing;
    try{ if('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; }catch(e){}
  }

  function nextIdx(){
    const n = tracks.length; if(!n) return -1;
    if(!shuffleOn || n===1) return (currentIndex+1)%n;
    let pool = [];
    for(let k=0;k<n;k++) if(k!==currentIndex && !played.has(String(tracks[k].id))) pool.push(k);
    if(!pool.length){
      played.clear(); if(curKey!==null) played.add(curKey);
      for(let k=0;k<n;k++) if(k!==currentIndex) pool.push(k);
    }
    return pool[Math.floor(Math.random()*pool.length)];
  }
  playBtn.onclick = ()=>{
    if(currentIndex===-1 && tracks.length>0){ playTrack(nextIdx()); return; }
    if(audio.paused) audio.play(); else audio.pause();
  };
  document.getElementById('prevBtn').onclick = ()=>{
    const n = tracks.length; if(!n) return;
    if(shuffleOn){
      while(hist.length){
        const k = hist.pop();
        const j = tracks.findIndex(t=>String(t.id)===k);
        if(j>=0 && j!==currentIndex){ playTrack(j, true); return; }
      }
      if(currentIndex>=0){ audio.currentTime = 0; audio.play(); return; }
      playTrack(nextIdx()); return;
    }
    playTrack(currentIndex<0 ? 0 : (currentIndex-1+n)%n);
  };
  document.getElementById('nextBtn').onclick = ()=>{
    if(tracks.length===0) return;
    playTrack(nextIdx());
  };
  const shuffleBtn = document.getElementById('shuffleBtn'), repeatBtn = document.getElementById('repeatBtn');
  function paintModes(){
    shuffleBtn.classList.toggle('on', shuffleOn); shuffleBtn.setAttribute('aria-pressed', shuffleOn);
    repeatBtn.classList.toggle('on', repeatOn); repeatBtn.setAttribute('aria-pressed', repeatOn);
    audio.loop = repeatOn;
  }
  try{ shuffleOn = localStorage.getItem('shuffle')==='1'; repeatOn = localStorage.getItem('repeat')==='1'; }catch(e){}
  paintModes();
  shuffleBtn.onclick = ()=>{
    shuffleOn = !shuffleOn;
    played.clear(); if(curKey!==null) played.add(curKey);
    try{ localStorage.setItem('shuffle', shuffleOn?'1':'0'); }catch(e){}
    paintModes();
  };
  repeatBtn.onclick = ()=>{
    repeatOn = !repeatOn;
    try{ localStorage.setItem('repeat', repeatOn?'1':'0'); }catch(e){}
    paintModes();
  };
  // --- Kilit ekranı / bildirim paneli kontrolleri ---
  let artUrl = null;
  function makeArt(){
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d'), g = x.createLinearGradient(0,0,512,512);
    g.addColorStop(0,'#f4a6bd'); g.addColorStop(1,'#c9a8d9');
    x.fillStyle = g; x.fillRect(0,0,512,512);
    x.fillStyle = '#fff'; x.beginPath(); x.moveTo(256,400);
    x.bezierCurveTo(90,290,110,130,256,190); x.bezierCurveTo(402,130,422,290,256,400); x.fill();
    return c.toDataURL('image/png');
  }
  function updateMedia(t){
    if(!('mediaSession' in navigator) || typeof MediaMetadata==='undefined') return;
    try{
      if(!artUrl) artUrl = makeArt();
      const pl = curPl && playlists.find(p=>p.id===curPl), hasCv = !!(pl && pl.cover);
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.name, artist: 'Aşkify', album: pl ? pl.name : 'Aşkify',
        artwork: [{src: hasCv ? pl.cover : artUrl, sizes: hasCv ? '300x300' : '512x512', type: hasCv ? 'image/jpeg' : 'image/png'}]
      });
    }catch(e){}
  }
  if('mediaSession' in navigator){
    const ms = navigator.mediaSession, setA = (a,f)=>{ try{ ms.setActionHandler(a,f); }catch(e){} };
    setA('play', ()=>audio.play());
    setA('pause', ()=>audio.pause());
    setA('previoustrack', ()=>document.getElementById('prevBtn').onclick());
    setA('nexttrack', ()=>document.getElementById('nextBtn').onclick());
    setA('seekto', (d)=>{ if(d && d.seekTime!=null && isFinite(d.seekTime)) audio.currentTime = d.seekTime; });
  }
  audio.onplay = ()=>setPlayingState(true);
  audio.onpause = ()=>setPlayingState(false);
  audio.onended = ()=>{
    if(tracks.length>0) playTrack(nextIdx());
  };
  audio.ontimeupdate = ()=>{
    if(audio.duration){
      try{ if('mediaSession' in navigator && navigator.mediaSession.setPositionState && isFinite(audio.duration)) navigator.mediaSession.setPositionState({duration:audio.duration, playbackRate:audio.playbackRate||1, position:Math.min(audio.currentTime, audio.duration)}); }catch(e){}
      progFill.style.width = (audio.currentTime/audio.duration*100)+'%';
      curT.textContent = fmt(audio.currentTime);
      durT.textContent = fmt(audio.duration);
    }
  };
  progTrack.onclick = (e)=>{
    const r = progTrack.getBoundingClientRect();
    const pct = (e.clientX-r.left)/r.width;
    if(audio.duration) audio.currentTime = pct*audio.duration;
  };

  document.getElementById('addBtn').onclick = ()=>{
    if(curPl){ if(!hasToken()){ document.getElementById('tokBtn').click(); return; } openPicker(curPl); }
    else document.getElementById('fileInput').click();
  };
  const GH_OWNER='bicinnetebakar', GH_REPO='askify', GH_DIR='songs', GH_BRANCH='main';
  const statusEl = document.getElementById('status');
  function hasToken(){ try{ return !!localStorage.getItem('ghtoken'); }catch(e){ return false; } }
  function showStatus(){ statusEl.textContent = ''; }
  const AUDIO_RE = /\.(mp3|m4a|wav|ogg|aac|flac)$/i;
  function remoteTrack(name){
    return {id:'r:'+name, name:name.replace(/\.[^/.]+$/,''), url: justUploaded[name] || GH_DIR+'/'+encodeURIComponent(name), builtin:true};
  }
  // GitHub'dan okuma: anahtar varsa onunla (saatte 5000 istek), yoksa ya da anahtar geçersizse anonim (saatte 60 istek)
  async function apiGet(url){
    if(hasToken()){
      try{
        const r = await fetch(url, {cache:'no-store', headers:{'Authorization':'Bearer '+localStorage.getItem('ghtoken'), 'Accept':'application/vnd.github+json'}});
        if(r.status!==401) return r;
      }catch(e){}
    }
    return fetch(url, {cache:'no-store'});
  }
  async function fetchRemote(){
    const cacheNames = ()=>{ try{ return JSON.parse(localStorage.getItem('songcache')||'[]'); }catch(e){ return []; } };
    try{
      const r = await apiGet('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_DIR+'?ref='+GH_BRANCH);
      if(r.status===404) return [];
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      const names = d.filter(x=>x.type==='file' && !deletedNames.has(x.name) && AUDIO_RE.test(x.name)).map(x=>x.name);
      try{ localStorage.setItem('songcache', JSON.stringify(names)); }catch(e){}
      return names.map(remoteTrack);
    }catch(e){
      const c = cacheNames().filter(n=>!deletedNames.has(n));
      statusEl.textContent = 'Şarkı listesi şu an GitHub\u2019dan alınamadı (kod: '+(e.message||'ağ')+'). '+(c.length ? 'En son bilinen liste gösteriliyor. ' : '')+'Biraz sonra sayfayı yenile.';
      return c.map(remoteTrack);
    }
  }
  async function ghUpload(file){
    const bytes = new Uint8Array(await file.arrayBuffer());
    let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
    const url = 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_DIR+'/'+encodeURIComponent(file.name);
    const r = await fetch(url, {method:'PUT', headers:{'Authorization':'Bearer '+localStorage.getItem('ghtoken'), 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},
      body: JSON.stringify({message:'Şarkı ekle: '+file.name, content: btoa(bin), branch: GH_BRANCH})});
    if(!r.ok) throw await ghFail(r);
  }
  document.getElementById('fileInput').onchange = async (e)=>{
    const files = Array.from(e.target.files);
    e.target.value='';
    for(const f of files){
      if(hasToken()){
        statusEl.textContent = 'Yükleniyor: '+f.name+' …';
        try{ await ghUpload(f); justUploaded[f.name] = URL.createObjectURL(f); statusEl.textContent = 'Yüklendi: '+f.name; }
        catch(err){ if(authFail(err)) break; statusEl.textContent = 'Yüklenemedi ('+f.name+'): '+err.message; }
      } else { await addTrack(f.name.replace(/\.[^/.]+$/,''), f); }
    }
    await loadTracks();
  };
  document.getElementById('tokBtn').onclick = (e)=>{ e.preventDefault(); tokenDialog(); };

  // --- pixel couple avatar, bobs when playing ---
  const avatar = document.getElementById('avatar');
  let avatarDancing = false;
  let frame = 0;
  const PALETTE = {
    outline:'#2a1a1f',
    skin:'#f4c8a8', skinShade:'#e3ab84', skinHi:'#fbe0c4',
    hairA:'#1c1410', hairAHi:'#3a2c26', hairAShade:'#000000',
    hairB:'#1c1410', hairBHi:'#3a2c26', hairBShade:'#000000',
    shirtA:'#2b2b2f', shirtAHi:'#454550', shirtAShade:'#161618',
    shirtB:'#e58aa3', shirtBHi:'#f0a8bc', shirtBShade:'#c4607d',
    eyeWhite:'#fbf6ee', eyeIrisA:'#4a3222', eyeIrisB:'#3a2418',
    cheek:'#f2a6ad', glassFrame:'#2b2b2b', lens:'#dbe9f5', lensHi:'#f0f8ff',
    mouth:'#a5615c', heart:'#e0839c'
  };
  function pr(x,y,w,h,c){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`; }

  // --- avatar sürprizleri: yükselen kalp/nota, dokununca kalp yağmuru, göz kırpma, gece yıldızları ---
  const parts = [];
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const COLS = ['#e0839c','#f4a6bd','#c9a8d9','#e8b978'];
  const STARS = Array.from({length:18}, (_,i)=>({x:-2+((i*47)%72), y:-2+((i*29)%46), big:i%4===0}));
  function spawnBurst(n, cx, cy){
    for(let i=0;i<n && parts.length<120;i++){
      const a = Math.random()*Math.PI*2, sp = 0.15+Math.random()*0.5, r = Math.random();
      parts.push({k: r<.6?'h':(r<.85?'s':'n'), x:cx+(Math.random()-.5)*6, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-0.35,
        l:0, m:60+Math.random()*50, c:COLS[Math.floor(Math.random()*COLS.length)], sc:0.6+Math.random()*0.5});
    }
  }
  avatar.addEventListener('click', ()=>spawnBurst(16, 34, 22));
  function heartPx(x,y,c,o,sc){
    const u = [[0,0,2],[3,0,2],[0,1,5],[1,2,3],[2,3,1]];
    return '<g opacity="'+o.toFixed(2)+'" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+sc.toFixed(2)+')">'+u.map(q=>pr(q[0],q[1],q[2],1,c)).join('')+'</g>';
  }
  function starsSvg(force){
    if(!force && !isDarkBg()) return '';
    return STARS.map((st,i)=>{
      const o = 0.25+0.75*Math.abs(Math.sin(frame/28+i*1.7));
      return '<g opacity="'+o.toFixed(2)+'">'+(st.big ? pr(st.x+1,st.y,1,3,'#fff3cf')+pr(st.x,st.y+1,3,1,'#fff3cf') : pr(st.x,st.y,1,1,'#fff3cf'))+'</g>';
    }).join('');
  }
  function particlesSvg(){
    if(avatarDancing && frame%16===0 && parts.length<120){
      const r = Math.random();
      parts.push({k: r<.65?'h':'n', x:26+Math.random()*16, y:8, vx:(Math.random()-.5)*0.12, vy:-0.28-Math.random()*0.15, l:0, m:100, c:COLS[Math.floor(Math.random()*COLS.length)], sc:0.7+Math.random()*0.3});
    }
    if(avatarDancing && parts.length<120 && frame%10===0){
      const left = frame%20===0, x = left ? vbx0+1+Math.random()*Math.max(1,4-vbx0) : 64+Math.random()*Math.max(1,vbx0+vbw-69);

      const p = parts[i]; p.l++; p.x += p.vx; p.y += p.vy; p.vx *= 0.99;
      if(p.l>=p.m || p.y<-6){ parts.splice(i,1); continue; }
      const o = Math.min(1, (p.m-p.l)/(p.m*0.4));
      if(p.k==='h') out += heartPx(p.x,p.y,p.c,o,p.sc);

  let vbx0 = -4, vbw = 76, level = 0;
  function fitAvatar(){
    const W = Math.min(avatar.parentNode.clientWidth || 260, 420), k = 260/76;
    vbw = Math.max(76, W/k); vbx0 = -4 - (vbw-76)/2;

  function barsSvg(){
    level += ((avatarDancing?1:0) - level)*0.06;
    if(level<0.03) return '';
    const base = 46, step = 3, lEnd = 5, rStart = 63;
    const nl = Math.max(0, Math.floor((lEnd - vbx0)/step)), nr = Math.max(0, Math.floor((vbx0+vbw - rStart)/step));
    let out = '<g opacity="0.85">';
    const bar = (x, i, n, p)=>{
      const v = (Math.sin(frame/6+p*1.9)+Math.sin(frame/9+p*0.8)+2)/4;
      const h = Math.max(1, Math.round((2 + v*16*(1-0.5*i/Math.max(1,n))) * level));
      return pr(x, base-h, 2, h, COLS[p%4]) + pr(x, base-h, 2, 1, '#fff3cf');
    };
    for(let i=0;i<nl;i++) out += bar(lEnd-(i+1)*step+1, i, nl, i);
    for(let i=0;i<nr;i++) out += bar(rStart+i*step, i, nr, i+nl);
    return out + '</g>';
  }

  let birdMix = 0;
  function birdSvg(b){
    const O = PALETTE.outline;
    birdMix += ((avatarDancing ? 1 : 0) - birdMix) * 0.05;
    const m = birdMix, t = frame/26, cx = vbx0 + vbw/2, axr = Math.max(14, Math.min(vbw/2 - 10, 34));
    const fx = cx + axr*Math.sin(t*0.9) - 6, fy = 10 + 11*Math.sin(t*1.7) + Math.sin(frame/3)*1.2;
    const bx = 28 + (fx-28)*m, by = 38 + Math.round(Math.sin(frame/12)*0.6)*(1-m) + (fy-38)*m;
    const dir = (m>0.3 && Math.cos(t*0.9)<0) ? -1 : 1;
    const up = m>0.3 ? (Math.floor(frame/3)%2===0) : (frame%220<12 && Math.floor(frame/3)%2===0);
    const B = (dx,dy,w,h,c)=>pr(dir>0 ? bx+dx : bx+12-dx-w, by+dy, w,h,c);
    let o = '';
    o += B(0,4,4,2,O)+B(0,4,3,1,b.tc)+B(0,5,3,1,b.tc);
    o += B(2,2,7,6,O)+B(3,3,5,4,b.c)+B(4,5,3,2,b.c2);
    o += B(6,0,5,5,O)+B(7,1,3,3,b.hc);
    if(b.crest) o += B(6,-2,2,3,b.crest)+B(8,-3,1,3,b.crest)+B(7,-3,1,2,b.crest);
    if(b.owl) o += B(6,-1,1,2,O)+B(9,-1,1,2,O)+B(7,1,3,3,'#fff')+B(8,2,1,1,'#222');
    else o += B(8,2,1,1,'#222');
    o += B(10,2,2,2,b.beak);
    if(m>0.3){
      if(up) o += B(3,-3,4,5,O)+B(4,-2,2,4,b.wc);
      else o += B(3,5,5,4,O)+B(4,5,3,3,b.wc);
    } else {
      o += up ? B(3,-3,4,5,O)+B(4,-2,2,4,b.wc) : B(3,4,4,2,b.wc);
      o += B(4,8,1,1,'#e8a020')+B(6,8,1,1,'#e8a020');
    }
    if(m>0.5 && frame%14===0 && parts.length<120) parts.push({k:'n', x:bx+(dir>0?0:10), y:by, vx:(Math.random()-.5)*0.1, vy:-0.2, l:0, m:70, c:COLS[Math.floor(Math.random()*COLS.length)], sc:1});
    return o;
  }

  function petSvg(){
    const b = PB[pet.breed]; if(pet.type==='none' || !b || b.t!==pet.type) return '';
    if(b.t==='bird') return birdSvg(b);
    const O = PALETTE.outline, cat = b.t==='cat', jump = (avatarDancing||petHappy) ? Math.abs(Math.sin(frame/6))*2 : 0;
    const x = 28, y = 33-jump, w = Math.round(Math.sin(frame/6)), dk = b.ec || ((b.mk==='mask'||b.mk==='cap'||b.mk==='rmask'||b.mk==='tri') ? b.m : b.c);
    let o = '';
    o += pr(x+10,y+9+w,3,4,O)+pr(x+10,y+10+w,2,3,dk);
    o += pr(x+2,y+9,8,5,O)+pr(x+3,y+9,6,4,b.c)+pr(x+4,y+10,4,3,b.c2);
    const pw = b.mk==='mask' ? b.m : b.c2; o += pr(x+3,y+12,2,1,pw)+pr(x+7,y+12,2,1,pw);
    if(b.mk==='stripes') o += pr(x+3,y+10,1,2,b.m)+pr(x+8,y+10,1,2,b.m);
    if(b.mk==='spots') o += pr(x+4,y+11,1,1,b.m)+pr(x+7,y+10,1,1,b.m)+pr(x+8,y+12,1,1,b.m);
    if(b.fluff) o += pr(x+3,y,6,3,O)+pr(x+4,y+1,4,2,b.c);
    if(b.mk==='beagle') o += pr(x+3,y+9,6,2,'#b8743a');
    if(b.mk==='tri') o += pr(x+3,y+10,2,2,'#3a3a48')+pr(x+7,y+10,2,3,b.m);
    if(b.fold) o += pr(x+2,y+1,3,3,O)+pr(x+3,y+1,2,2,b.c)+pr(x+7,y+1,3,3,O)+pr(x+7,y+1,2,2,b.c);
    else if(!b.flop) o += pr(x+1,y,4,4,O)+pr(x+2,y+1,2,3,dk)+pr(x+2,y+2,1,1,b.ear)+pr(x+8,y,4,4,O)+pr(x+8,y+1,2,3,dk)+pr(x+9,y+2,1,1,b.ear);
    o += pr(x+1,y+2,10,8,O)+pr(x+2,y+3,8,6,b.c);
    if(b.mk==='stripes') o += pr(x+4,y+3,1,2,b.m)+pr(x+7,y+3,1,2,b.m);
    else if(b.mk==='cap') o += pr(x+2,y+3,3,2,b.m)+pr(x+7,y+3,3,2,b.m);
    else if(b.mk==='mask' || b.mk==='rmask') o += pr(x+4,y+6,4,3,b.m);
    else if(b.mk==='tri') o += pr(x+2,y+3,3,3,b.m)+pr(x+7,y+3,3,2,'#3a3a48');
    else if(b.mk==='beagle') o += pr(x+2,y+3,3,3,'#b8743a')+pr(x+7,y+3,3,3,'#b8743a');
    else if(b.mk==='wrinkle') o += pr(x+4,y+4,4,1,'#c88a7a')+pr(x+3,y+9,6,1,'#c88a7a');
    else if(b.mk==='lower') o += pr(x+3,y+6,6,3,b.c2);
    else if(b.mk==='husky') o += pr(x+2,y+3,8,2,b.ear)+pr(x+3,y+6,6,3,b.c2);
    else if(b.mk==='muz') o += pr(x+4,y+6,4,3,'#3a3038');
    else if(b.mk==='spots') o += pr(x+3,y+4,2,2,b.m)+pr(x+8,y+3,1,1,b.m);
    const eh = (frame%160<6) ? 1 : 2;
    o += pr(x+3,y+5,2,eh,b.eye)+pr(x+7,y+5,2,eh,b.eye2||b.eye);
    o += pr(x+5,y+7,2,1, cat ? '#ff8fb1' : (b.mk==='muz' ? '#777' : '#222'));
    if(!cat && avatarDancing) o += pr(x+5,y+8,2,2,'#ff7a9a'); else o += pr(x+5,y+8,2,1,O);
    if(cat) o += pr(x-1,y+7,2,1,'#aaa')+pr(x+11,y+7,2,1,'#aaa')+pr(x-1,y+8,2,1,'#aaa')+pr(x+11,y+8,2,1,'#aaa');
    if(!cat && b.flop) o += pr(x,y+3,3,6,O)+pr(x+1,y+4,2,4,b.ear)+pr(x+9,y+3,3,6,O)+pr(x+9,y+4,2,4,b.ear);
    return o;
  }

  let act = null, petHappy = false;
  function doAct(k){
    act = {k, t0:frame, d: k==='hug' ? 180 : k==='jump' ? 200 : 160};
    if(k!=='jump') for(let i=0;i<7;i++) parts.push({k:'h', x:26+Math.random()*16, y:24+Math.random()*8, vx:(Math.random()-.5)*0.2, vy:-0.3-Math.random()*0.2, l:-i*8, m:110, c:COLS[i%COLS.length], sc:0.8+Math.random()*0.3});
  }
  function actSvg(k,e,ax,ay,bx,by){
    if(!k || e<=0.05) return '';
    const O = PALETTE.outline, sk = PALETTE.skin, mid = (ax+bx)/2+10, pul = Math.sin(frame/6);
    let o = '';
    if(k==='hug' && e>0.55){
      const wA = (bx+12)-(ax+15), wB = (bx+5)-(ax+4);
      o += pr(ax+15,ay+21,wA,4,O)+pr(ax+15,ay+22,wA,2,PALETTE.shirtA)+pr(bx+11,ay+22,2,2,sk);
      o += pr(ax+4,by+25,wB,4,O)+pr(ax+4,by+26,wB,2,PALETTE.shirtB)+pr(ax+3,by+26,2,2,sk);
      o += heartPx(mid-3, Math.min(ay,by)-7-e*2, '#ff5c8a', 0.95, 1.6+0.15*pul);
    } else if(k==='hold' && e>0.55){
      const xa = ax+16, xb = bx+3, yy = (ay+by)/2+29;
      o += pr(xa-1,yy,xb-xa+3,3,O)+pr(xa,yy+1,xb-xa+1,1,sk);
      o += heartPx(mid-2, Math.min(ay,by)-6-e*2, '#ff8fb1', 0.9, 1.3+0.1*pul);
    } else if(k==='kiss'){
      o += heartPx(mid-4, Math.min(ay,by)-8-e*3, '#ff5c8a', Math.min(1,e*1.5), 2.2+0.25*pul);
      o += heartPx(mid-9, Math.min(ay,by)-2, '#ffb3c8', e, 0.8)+heartPx(mid+6, Math.min(ay,by)-3, '#ffd95a', e, 0.8);
    } else if(k==='jump'){
      o += '<g opacity="'+e.toFixed(2)+'">'+pr(mid-16,4+pul,1,1,'#fff3cf')+pr(mid+14,6-pul,1,1,'#fff3cf')+pr(mid,1,1,1,'#fff3cf')+'</g>';
    } else if(k==='pet'){
      o += heartPx(32+Math.sin(frame/7)*3, 27-((frame%50)/5), '#ff5c8a', e, 0.9)+heartPx(37, 24-((frame%40)/4), '#ffb3c8', e, 0.7);
    }
    return o;
  }

  function drawAvatar(){
    const bob = avatarDancing ? Math.sin(frame/6)*2.2 : 0;
    const bob2 = avatarDancing ? Math.sin(frame/6+1)*2.2 : 0;
    const sway = avatarDancing ? Math.sin(frame/6)*1 : 0;
    let actE = 0; const actK = act ? act.k : '';
    if(act){ const p = (frame-act.t0)/act.d; if(p>=1) act = null; else actE = Math.min(1, Math.sin(p*Math.PI)*1.8); }
    petHappy = actK==='pet' && actE>0;
    const actMove = actE*(actK==='hug'?7:actK==='kiss'?8:actK==='hold'?7:actK==='pet'?5:0);
    const jA = actK==='jump' ? actE*Math.abs(Math.sin(frame/10))*5 : 0, jB = actK==='jump' ? actE*Math.abs(Math.sin(frame/10+0.9))*5 : 0;
    let s = (sceneKey ? sceneSvg() : starsSvg()) + barsSvg();

    // ===== person A (left) — erkek, kahverengi dağınık saç, gözlüklü =====
    const ax=8+sway+actMove, ay=8+bob-jA;
    // hair back mass (outline)
    s += pr(ax+1, ay+0, 18, 11, PALETTE.outline);
    s += pr(ax+2, ay+1, 16, 9, PALETTE.hairA);
    // spiky top strands
    s += pr(ax+3, ay-1, 3, 3, PALETTE.hairA);
    s += pr(ax+8, ay-2, 3, 3, PALETTE.hairA);
    s += pr(ax+13, ay-1, 3, 3, PALETTE.hairA);
    s += pr(ax+4, ay+1, 2, 2, PALETTE.hairAHi);
    s += pr(ax+10, ay+1, 2, 2, PALETTE.hairAHi);
    // face
    s += pr(ax+4, ay+7, 12, 11, PALETTE.outline);
    s += pr(ax+5, ay+8, 10, 9, PALETTE.skin);
    s += pr(ax+5, ay+15, 10, 2, PALETTE.skinShade);
    s += pr(ax+6, ay+8, 3, 2, PALETTE.skinHi);

    s += pr(ax+4, ay+8, 2, 5, PALETTE.hairAShade);
    s += pr(ax+14, ay+8, 2, 5, PALETTE.hairAShade);
    // eyebrows
    s += pr(ax+6, ay+9, 3, 1, PALETTE.hairAShade);
    s += pr(ax+11, ay+9, 3, 1, PALETTE.hairAShade);
    // glasses (rounder, with bridge + outline)
    s += pr(ax+5, ay+10, 4, 4, PALETTE.outline);
    s += pr(ax+11, ay+10, 4, 4, PALETTE.outline);
    s += pr(ax+6, ay+11, 2, 2, PALETTE.lens);
    s += pr(ax+12, ay+11, 2, 2, PALETTE.lens);
    s += pr(ax+6, ay+11, 1, 1, PALETTE.lensHi);
    s += pr(ax+12, ay+11, 1, 1, PALETTE.lensHi);
    s += pr(ax+9, ay+11, 2, 1, PALETTE.outline);
    // nose + mouth
    s += pr(ax+9, ay+14, 2, 1, PALETTE.skinShade);
    s += pr(ax+8, ay+16, 4, 1, PALETTE.mouth);
    s += pr(ax+5, ay+15, 2, 1, PALETTE.cheek);
    s += pr(ax+13, ay+15, 2, 1, PALETTE.cheek);
    // neck

  async function ghFail(r){
    const e = await r.json().catch(()=>({})), m = e.message || '';
    if(r.status===401 || /bad credentials/i.test(m)) return new Error('Bad credentials');
    if(/rate limit/i.test(m)) return new Error('GitHub şu an çok fazla istek aldı. Biraz sonra tekrar dene.');
    if(r.status===403 || /not accessible|permission/i.test(m)) return new Error('GitHub izin vermedi (403). Anahtarın sadece askify deposu için ve Contents → Read and write izniyle oluşturulduğundan emin ol; sorun sürerse yeni anahtar oluştur.');
    return new Error(m || ('GitHub hata kodu '+r.status));

  function authH(){ return {'Authorization':'Bearer '+localStorage.getItem('ghtoken'), 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}; }
  async function ghGetPlaylists(){
    const r = await apiGet(GH_API+'/contents/playlists.json?ref='+GH_BRANCH);
    if(r.status===404) return {data:{playlists:[]}, sha:null};
    if(!r.ok) throw await ghFail(r);
    const d = await r.json();
    let txt;
    if(d.content) txt = new TextDecoder().decode(Uint8Array.from(atob(d.content.replace(/\n/g,'')), c=>c.charCodeAt(0)));
    else txt = await (await fetch(d.download_url, {cache:'no-store'})).text();
    return {data: JSON.parse(txt), sha: d.sha};
  }
  async function updatePlaylists(mutate){
    for(let n=0;n<2;n++){
      const {data, sha} = await ghGetPlaylists();
      if(!data.playlists) data.playlists = [];
      mutate(data);
      const body = {message:'Çalma listesi güncelle', content: toB64(new TextEncoder().encode(JSON.stringify(data))), branch: GH_BRANCH};
      if(sha) body.sha = sha;
      const r = await fetch(GH_API+'/contents/playlists.json', {method:'PUT', headers:authH(), body:JSON.stringify(body)});
      if(r.ok){ playlists = data.playlists; return; }
      if(r.status!==409 && r.status!==422) throw await ghFail(r);
    }
    throw new Error('Kaydedilemedi, tekrar dene');
  }

  function coverFromFile(file){
    return new Promise((res, rej)=>{
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = ()=>{
        const S = 300, c = document.createElement('canvas'); c.width = c.height = S;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
        URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = ()=>rej(new Error('Fotoğraf okunamadı'));
      img.src = u;
    });
  }

  let albSelMode = false; const albSelSet = new Set();
