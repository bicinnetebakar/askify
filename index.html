<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elif için</title>
<style>
  :root{
    --bg:#fbeef2; --bg2:#f7e2ea; --card:#fffaf9; --card2:#fdeef2;
    --ink:#4a2e38; --ink-dim:#9a7482; --rose:#e0839c; --rose-dark:#c4607d;
    --lav:#c9a8d9; --border:#f0cdd9; --gold:#e8b978;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#231620; --bg2:#2c1c28; --card:#2f1e2a; --card2:#3a2531;
      --ink:#f5e3ea; --ink-dim:#c79cae; --border:#4a2f3d;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--ink); font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%; display:flex; justify-content:center;
  }
  .app{ width:100%; max-width:420px; padding:22px 18px 32px; position:relative; }
  .title{ text-align:center; margin:6px 0 2px; }
  .title h1{ font-size:1.6rem; margin:0; color:var(--rose-dark); font-weight:600; }
  .title p{ margin:6px 0 0; font-size:.92rem; color:var(--ink-dim); font-style:italic; }

  .avatar-wrap{ display:flex; justify-content:center; margin:22px 0 10px; }
  #avatar{ image-rendering:pixelated; width:260px; height:auto; filter:drop-shadow(0 8px 16px rgba(196,96,125,.25)); }

  .now{ text-align:center; margin:6px 0 18px; min-height:44px; }
  .now .song{ font-size:1.05rem; font-weight:600; color:var(--ink); }
  .now .empty{ color:var(--ink-dim); font-size:.9rem; }

  .player{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:0 6px 20px rgba(196,96,125,.12);
  }
  .progress-track{
    height:5px; background:var(--card2); border-radius:3px; cursor:pointer; margin-bottom:12px;
  }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--rose),var(--lav)); border-radius:3px; width:0%; }
  .times{ display:flex; justify-content:space-between; font-size:.7rem; color:var(--ink-dim); margin:-8px 0 12px; font-family:ui-monospace,monospace; }

  .controls{ display:flex; align-items:center; justify-content:center; gap:18px; }
  .ctrl-btn{
    background:none; border:none; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:6px;
  }
  .ctrl-btn svg{ width:22px; height:22px; }
  #playBtn{
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(145deg,var(--rose),var(--rose-dark));
    color:#fff; box-shadow:0 4px 14px rgba(196,96,125,.4);
  }
  #playBtn svg{ width:22px; height:22px; }

  .playlist{ margin-top:20px; }
  .pl-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .pl-head h2{ font-size:.78rem; letter-spacing:.06em; color:var(--ink-dim); margin:0; font-weight:600; }
  #addBtn{
    background:var(--card2); border:1px solid var(--border); color:var(--rose-dark);
    padding:5px 12px; border-radius:20px; font-size:.78rem; cursor:pointer;
  }
  #fileInput{ display:none; }
  #list{ display:flex; flex-direction:column; gap:6px; }
  .track{
    display:flex; align-items:center; gap:10px; padding:9px 10px;
    background:var(--card); border:1px solid var(--border); border-radius:10px; cursor:pointer;
  }
  .track.active{ border-color:var(--rose); background:var(--card2); }
  .track .num{ font-size:.75rem; color:var(--ink-dim); font-family:ui-monospace,monospace; width:16px; }
  .track .name{ flex:1; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track .del{ color:var(--ink-dim); opacity:.6; font-size:.85rem; padding:2px 6px; }
  .empty-list{ text-align:center; color:var(--ink-dim); font-size:.85rem; padding:26px 10px; }
  .note{ text-align:center; font-size:.72rem; color:var(--ink-dim); margin-top:16px; line-height:1.5; }


  #pls{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; }
  .chip{ flex:none; display:flex; align-items:center; gap:6px; padding:4px 12px 4px 4px; background:var(--card); border:1px solid var(--border); border-radius:24px; cursor:pointer; font-size:.8rem; color:var(--ink); white-space:nowrap; }
  .chip.active{ border-color:var(--rose); background:var(--card2); }
  .chip.plus{ padding:6px 12px; color:var(--rose-dark); }
  .chip .cv{ width:26px; height:26px; border-radius:50%; background:var(--card2) center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:.8rem; }
  #plHead{ display:none; align-items:center; gap:12px; margin-bottom:10px; }
  #plHead .big{ width:64px; height:64px; border-radius:12px; background:var(--card2) center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
  #plHead .nm{ flex:1; font-weight:600; }
  .mini{ background:var(--card2); border:1px solid var(--border); color:var(--rose-dark); padding:4px 10px; border-radius:14px; font-size:.75rem; cursor:pointer; }
  .track .add{ color:var(--rose-dark); font-size:1.1rem; padding:0 6px; }
  .track .rm{ color:var(--ink-dim); opacity:.6; font-size:.85rem; padding:2px 6px; }
  #sheet{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:flex-end; justify-content:center; z-index:55; }
  #sheet .box{ width:100%; max-width:420px; background:var(--card); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); max-height:70%; overflow:auto; }
  #sheet h3{ margin:0 0 10px; font-size:.9rem; color:var(--ink-dim); }
  #sheet button{ display:block; width:100%; text-align:left; margin-top:6px; padding:10px; background:var(--card2); border:1px solid var(--border); border-radius:10px; color:var(--ink); font:inherit; font-size:.9rem; cursor:pointer; }

  .ctrl-btn.on{ color:var(--rose-dark); background:var(--card2); border-radius:50%; box-shadow:0 0 0 1.5px var(--rose) inset; }
  #dlg{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:60; padding:18px; }
  #dlg .card{ width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:22px 20px 18px; box-shadow:0 12px 40px rgba(0,0,0,.25); max-height:100%; overflow:auto; }
  #dlg h3{ margin:0 0 14px; color:var(--rose-dark); font-size:1.1rem; font-weight:600; }
  #dlg label{ display:block; margin:14px 0 6px; font-size:.8rem; color:var(--ink-dim); }
  #dlg .hint{ margin:0 0 4px; font-size:.85rem; color:var(--ink-dim); line-height:1.5; }
  #dlg input[type=text], #sheet input[type=text]{ width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; background:var(--bg); color:var(--ink); font:inherit; font-size:1rem; outline:none; }
  #dlg input[type=text]:focus, #sheet input[type=text]:focus{ border-color:var(--rose); }
  #dlg input.bad{ border-color:#d64545; }
  #dlg .cvrow{ display:flex; align-items:center; gap:12px; }
  #dlg .cvprev{ width:64px; height:64px; border-radius:12px; background:var(--card2) center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--ink-dim); }
  #dlg .row{ display:flex; gap:10px; margin-top:20px; }
  #dlg .btn{ flex:1; padding:11px 14px; border-radius:12px; border:1px solid var(--border); font:inherit; font-size:.92rem; cursor:pointer; }
  #dlg .cvrow .btn{ flex:none; }
  #dlg .btn.sec{ background:var(--card2); color:var(--ink); }
  #dlg .btn.pri{ background:linear-gradient(145deg,var(--rose),var(--rose-dark)); color:#fff; border-color:transparent; }
  #dlg .btn.danger{ display:block; width:100%; margin-top:12px; background:none; border:none; color:#c0392b; font-size:.82rem; }
  #sheet .box.pick{ display:flex; flex-direction:column; max-height:85%; overflow:hidden; }
  #sheet .plist{ overflow:auto; flex:1; margin:10px 0; }
  #sheet .prow{ display:flex; align-items:center; gap:10px; padding:10px; margin-top:6px; background:var(--card2); border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:.9rem; }
  #sheet .prow.on{ border-color:var(--rose); }
  #sheet .prow .tick{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-size:.8rem; }
  #sheet .prow.on .tick{ background:var(--rose-dark); border-color:var(--rose-dark); }
  #sheet .prow .pn{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sheet .pfoot button.done{ background:linear-gradient(145deg,var(--rose),var(--rose-dark)); color:#fff; border-color:transparent; text-align:center; }
  #sheet .pfoot button.cancel{ text-align:center; }
  #avatar{ cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .track .grip{ touch-action:none; cursor:grab; color:var(--ink-dim); font-size:1.15rem; padding:2px 8px; user-select:none; -webkit-user-select:none; }
  .track .gdel{ color:var(--ink-dim); opacity:.75; font-size:.85rem; padding:2px 6px; }
  .track.shifting{ transition:transform .15s; }
  .track.dragging{ position:relative; z-index:5; box-shadow:0 8px 20px rgba(196,96,125,.35); transition:none; }
  #dayc{ position:absolute; top:22px; left:18px; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; line-height:1.15; padding:6px 10px; max-width:112px; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 3px 10px rgba(196,96,125,.15); cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #dayc .n{ font-size:.95rem; font-weight:700; color:var(--rose-dark); }
  #dayc .l{ font-size:.62rem; color:var(--ink-dim); margin-top:2px; }
  #dayc.special{ background:linear-gradient(145deg,var(--rose),var(--lav)); border-color:transparent; animation:dpulse 2.4s ease-in-out infinite; }
  #dayc.special .n, #dayc.special .l{ color:#fff; }
  @keyframes dpulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  #albBtn{ position:absolute; top:22px; right:18px; z-index:2; width:40px; height:40px; padding:0; border-radius:14px; border:1px solid var(--border); background:var(--card); box-shadow:0 3px 10px rgba(196,96,125,.15); font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
  #album{ display:none; position:fixed; inset:0; z-index:30; flex-direction:column; background:linear-gradient(180deg,var(--bg),var(--bg2)); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color:var(--ink); }
  .alb-head{ display:flex; align-items:center; gap:8px; padding:14px 14px 8px; max-width:640px; width:100%; margin:0 auto; }
  .alb-title{ flex:1; font-size:1.15rem; font-weight:600; color:var(--rose-dark); }
  #albMsg{ text-align:center; font-size:.8rem; color:var(--ink-dim); padding:2px 14px; min-height:1.3em; }
  #albBody{ flex:1; overflow:auto; padding:6px 10px 24px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  #albGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:640px; margin:0 auto; }
  .alb-cell{ aspect-ratio:1; background:var(--card2); border-radius:8px; overflow:hidden; cursor:pointer; }
  .alb-cell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .alb-empty{ grid-column:1/-1; text-align:center; color:var(--ink-dim); font-size:.9rem; padding:40px 10px; line-height:1.6; }
  #viewer{ display:none; position:fixed; inset:0; z-index:40; background:#000; align-items:center; justify-content:center; touch-action:pan-y; }
  #vImg{ max-width:100%; max-height:100%; object-fit:contain; transition:opacity .15s; }
  #viewer button{ position:absolute; background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:50%; width:44px; height:44px; padding:0; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #vClose{ top:calc(12px + env(safe-area-inset-top,0px)); right:12px; }
  #vDel{ top:calc(12px + env(safe-area-inset-top,0px)); left:12px; }
  #vPrev{ left:8px; top:50%; margin-top:-22px; }
  #vNext{ right:8px; top:50%; margin-top:-22px; }
  #vCount{ position:absolute; bottom:calc(14px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; color:#fff; font-size:.8rem; opacity:.8; }
</style>
</head>
<body>
<div class="app">
  <button id="albBtn" aria-label="Albüm" title="Albüm">📷</button>
  <div id="dayc" title="Dokun: yıl / ay / gün"><span class="n" id="dayN"></span><span class="l" id="dayL"></span></div>
  <div class="title">
    <h1>Elif için 🎵</h1>
    <p>Dinlerken beni düşün</p>
  </div>

  <div class="avatar-wrap">
    <svg id="avatar" viewBox="-4 -4 76 52" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"></svg>
  </div>

  <div class="now">
    <div class="song" id="nowSong">—</div>
    <div class="empty" id="nowEmpty">Henüz şarkı eklenmedi</div>
  </div>

  <div class="player">
    <div class="progress-track" id="progTrack"><div class="progress-fill" id="progFill"></div></div>
    <div class="times"><span id="curT">0:00</span><span id="durT">0:00</span></div>
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn" aria-label="Karışık çal" title="Karışık çal">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" aria-label="Önceki">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
      </button>
      <button id="playBtn" aria-label="Oynat">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Sonraki">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" aria-label="Aynı şarkıyı tekrarla" title="Aynı şarkıyı tekrarla">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
      </button>
    </div>
  </div>

  <div class="playlist">
    <div id="pls"></div>
    <div id="plHead"></div>
    <div class="pl-head">
      <h2>ÇALMA LİSTESİ</h2>
      <button id="addBtn">+ Şarkı ekle</button>
      <input type="file" id="fileInput" accept="audio/*" multiple>
    </div>
    <div id="list"></div>
  </div>

  <div class="note" id="status"></div>
  <a href="#" id="tokBtn" style="display:none" aria-hidden="true"></a>
</div>

<div id="sheet"></div>
<div id="dlg"></div>
<div id="album">
  <div class="alb-head"><div class="alb-title">Albümümüz 💗</div><button class="mini" id="albAdd">＋ Fotoğraf ekle</button><button class="mini" id="albClose" aria-label="Kapat">✕</button></div>
  <div id="albMsg"></div>
  <div id="albBody"><div id="albGrid"></div></div>
  <input type="file" id="albFile" accept="image/*" multiple style="display:none">
</div>
<div id="viewer">
  <img id="vImg" alt="">
  <button id="vClose" aria-label="Kapat">✕</button>
  <button id="vDel" aria-label="Sil">🗑</button>
  <button id="vPrev" aria-label="Önceki">‹</button>
  <button id="vNext" aria-label="Sonraki">›</button>
  <div id="vCount"></div>
</div>
<input type="file" id="coverInput" accept="image/*" style="display:none">
<audio id="audio"></audio>

<script>
const BUILTIN = [];
</script>
<script>
(function(){
  const DB_NAME='elif-muzik', STORE='tracks';
  let db;
  function openDB(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{
        req.result.createObjectStore(STORE, {keyPath:'id', autoIncrement:true});
      };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
  }
  function addTrack(name, blob){
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readwrite');
      const req = tx.objectStore(STORE).add({name, blob});
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
  }
  function getAllTracks(){
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
  }
  function deleteTrack(id){
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = ()=>res();
      req.onerror = ()=>rej(req.error);
    });
  }

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const listEl = document.getElementById('list');
  const nowSong = document.getElementById('nowSong');
  const nowEmpty = document.getElementById('nowEmpty');
  const progFill = document.getElementById('progFill');
  const progTrack = document.getElementById('progTrack');
  const curT = document.getElementById('curT');
  const durT = document.getElementById('durT');

  let tracks = [], allTracks = [], playlists = [], curPl = null, curKey = null;
  let currentIndex = -1;
  let shuffleOn = false, repeatOn = false;
  const played = new Set(); const hist = [];
  let objectUrl = null;
  const justUploaded = {}; const deletedNames = new Set();

  function fmt(s){
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m+':'+String(sec).padStart(2,'0');
  }

  function renderList(){
    listEl.innerHTML='';
    if(tracks.length===0){
      listEl.innerHTML = '<div class="empty-list">'+(curPl ? 'Bu listede henüz şarkı yok. Sağ üstteki "＋ Şarkı seç" ile ekleyebilirsin.' : 'Henüz şarkı yok — sağ üstten ekleyebilirsin')+'</div>';
      return;
    }
    tracks.forEach((t,i)=>{
      const div = document.createElement('div');
      div.className = 'track'+(i===currentIndex?' active':'');
      div.innerHTML = `<span class="num">${i+1}</span><span class="name">${esc(t.name)}</span>${tailFor(t)}`;
      div.querySelector('.name').onclick = ()=>playTrack(i);
      div.querySelector('.num').onclick = ()=>playTrack(i);
      const delEl = div.querySelector('.del');
      if(delEl) delEl.onclick = async (e)=>{
        e.stopPropagation();
        await deleteTrack(t.id);
        if(i===currentIndex){ audio.pause(); currentIndex=-1; nowSong.textContent='—'; nowEmpty.style.display='block'; setPlayingState(false); }
        await loadTracks();
      };
      const addEl = div.querySelector('.add');
      if(addEl) addEl.onclick = (ev)=>{ ev.stopPropagation(); if(!hasToken()){ document.getElementById('tokBtn').click(); return; } openAddSheet(t); };
      const rmEl = div.querySelector('.rm');
      if(rmEl) rmEl.onclick = (ev)=>{ ev.stopPropagation(); const k=String(t.id); plAction(()=>updatePlaylists(d=>{ const p=d.playlists.find(x=>x.id===curPl); if(p) p.tracks=p.tracks.filter(x=>x!==k); })); };
      const gdEl = div.querySelector('.gdel');
      if(gdEl) gdEl.onclick = (ev)=>{
        ev.stopPropagation();
        confirmDlg('Şarkı silinsin mi?', '“'+t.name+'” depodan silinir ve tüm listelerden de kalkar. Bu işlem sayfadan geri alınamaz.', 'Sil',
          async ()=>{ await plAction(()=>deleteRemote(t)); await loadTracks(); });
      };
      const gripEl = div.querySelector('.grip');
      if(gripEl) attachDrag(gripEl, i);
      listEl.appendChild(div);
    });
  }

  function attachDrag(grip, i){
    grip.addEventListener('pointerdown', (e)=>{
      if(tracks.length<2) return;
      e.preventDefault(); e.stopPropagation();
      const rows = Array.from(listEl.children), me = rows[i]; if(!me) return;
      const n = rows.length, h = me.getBoundingClientRect().height + 6;
      const y0 = e.clientY, s0 = window.scrollY;
      let lastY = e.clientY, j = i;
      try{ grip.setPointerCapture(e.pointerId); }catch(err){}
      rows.forEach(r=>r.classList.add('shifting')); me.classList.remove('shifting'); me.classList.add('dragging');
      function update(){
        const dy = (lastY - y0) + (window.scrollY - s0);
        me.style.transform = 'translateY('+dy+'px)';
        j = Math.max(0, Math.min(n-1, Math.round(i + dy/h)));
        rows.forEach((r,k)=>{
          if(k===i) return;
          let sh = 0;
          if(k>i && k<=j) sh = -h; else if(k<i && k>=j) sh = h;

  async function apiGet(url){

      if(r.status===404) return [];
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      const names = d.filter(x=>x.type==='file' && !deletedNames.has(x.name) && AUDIO_RE.test(x.name)).map(x=>x.name);

    const url = 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_DIR+'/'+encodeURIComponent(file.name);
    const r = await fetch(url, {method:'PUT', headers:{'Authorization':'Bearer '+localStorage.getItem('ghtoken'), 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},

    s += pr(hx+1, hy+6, 4, 2, PALETTE.heart);

    if(!r.ok) throw await ghFail(r);
    const d = await r.json();
    let txt;
    if(d.content) txt = new TextDecoder().decode(Uint8Array.from(atob(d.content.replace(/\n/g,'')), c=>c.charCodeAt(0)));
    else txt = await (await fetch(d.download_url, {cache:'no-store'})).text();
    return {data: JSON.parse(txt), sha: d.sha};
  }

  function coverFromFile(file){
    return new Promise((res, rej)=>{
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = ()=>{
        const S = 300, c = document.createElement('canvas'); c.width = c.height = S;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
        URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = ()=>rej(new Error('Fotoğraf okunamadı'));
      img.src = u;
    });
  }

  async function albBlob(dir, name){
    const key = 'https://album.local/'+dir+'/'+name;
    let cache = null;
    if('caches' in window){
      try{ cache = await caches.open('elif-album-v1'); const hit = await cache.match(key); if(hit) return await hit.blob(); }catch(e){ cache = null; }
    }

    if(!r.ok) throw await albFail(r);
    const blob = new Blob([await r.arrayBuffer()], {type:'image/jpeg'});
    if(cache){ try{ await cache.put(key, new Response(blob, {headers:{'Content-Type':'image/jpeg'}})); }catch(e){} }
    return blob;
  }

  function resizeJpeg(file, max, q){
    return new Promise((res, rej)=>{
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u);
        c.toBlob(b=>b ? res(b) : rej(new Error('Fotoğraf küçültülemedi')), 'image/jpeg', q);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error('Fotoğraf okunamadı')); };
      img.src = u;
    });
  }

    albBusy = true; let ok = 0, lastErr = '';
    for(let i=0;i<files.length;i++){
      const f = files[i]; albMsg('Yükleniyor '+(i+1)+'/'+files.length+'…');
      try{
        const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';
        const full = await resizeJpeg(f, 1600, 0.82), th = await resizeJpeg(f, 400, 0.75);
        await albPut('photos/'+id, full); await albPut('thumbs/'+id, th); ok++;
      }catch(err){
        if(authFail(err)){ albBusy = false; closeAlbum(); return; }
        lastErr = f.name+': '+err.message;
      }
    }
    albBusy = false;
    try{ albNames = await albList(); renderGrid(); }catch(e){}
    albMsg(lastErr ? ('Bazıları yüklenemedi — '+lastErr) : (ok+' fotoğraf eklendi 💗'));
  }
  function openViewer(i){ viewer.style.display = 'flex'; showViewer(i); }
  function closeViewer(){ viewer.style.display = 'none'; vImg.removeAttribute('src'); if(vUrl){ URL.revokeObjectURL(vUrl); vUrl = null; } }
  async function showViewer(i){
    if(!albNames.length){ closeViewer(); return; }
    vIdx = (i+albNames.length)%albNames.length; const my = vIdx;
    vCount.textContent = (my+1)+' / '+albNames.length; vImg.style.opacity = .3;
    try{
      const b = await albBlob('photos', albNames[my]);
      if(vIdx!==my) return;
      if(vUrl) URL.revokeObjectURL(vUrl);
      vUrl = URL.createObjectURL(b); vImg.src = vUrl; vImg.style.opacity = 1;
      if(albNames.length>1) albBlob('photos', albNames[(my+1)%albNames.length]).catch(()=>{});
    }catch(err){ vCount.textContent = err.message; }
  }
  document.getElementById('albBtn').onclick = openAlbum;
  document.getElementById('albClose').onclick = closeAlbum;
  document.getElementById('albAdd').onclick = ()=>{ if(!albBusy) document.getElementById('albFile').click(); };
  document.getElementById('albFile').onchange = (e)=>{ const fs = Array.from(e.target.files); e.target.value = ''; albUpload(fs); };
  document.getElementById('vClose').onclick = closeViewer;
  document.getElementById('vPrev').onclick = ()=>showViewer(vIdx-1);
  document.getElementById('vNext').onclick = ()=>showViewer(vIdx+1);
  document.getElementById('vDel').onclick = ()=>{
    const nm = albNames[vIdx]; if(!nm) return;
    confirmDlg('Fotoğraf silinsin mi?', 'Albümden silinir, ikinizde de kalkar. Bu işlem geri alınamaz.', 'Sil', async ()=>{
      try{
        albMsg('Siliniyor…');
        await albDelOne('thumbs/'+nm); await albDelOne('photos/'+nm); await albUncache(nm);
        albNames = albNames.filter(x=>x!==nm); renderGrid(); albMsg('');
        if(albNames.length) showViewer(Math.min(vIdx, albNames.length-1)); else closeViewer();
      }catch(err){ if(authFail(err)){ closeAlbum(); return; } albMsg(err.message); }
    });
  };
  let tx0 = null;
  viewer.addEventListener('touchstart', (e)=>{ tx0 = e.touches[0].clientX; }, {passive:true});
  viewer.addEventListener('touchend', (e)=>{
    if(tx0===null) return; const dx = e.changedTouches[0].clientX - tx0; tx0 = null;
    if(Math.abs(dx)>50) showViewer(vIdx + (dx<0 ? 1 : -1));
  }, {passive:true});
  document.addEventListener('keydown', (e)=>{
    if(viewer.style.display==='flex'){
      if(e.key==='ArrowLeft') showViewer(vIdx-1); else if(e.key==='ArrowRight') showViewer(vIdx+1); else if(e.key==='Escape') closeViewer();
    } else if(albumEl.style.display==='flex' && e.key==='Escape') closeAlbum();
  });

  // --- Gün sayacı (gerçek tarihe bağlı, her gün kendiliğinden artar) ---
  const MEET = [2022, 7, 31];   // tanıştığınız gün: yıl, ay, gün (o gün 1. gün sayılır)
  const dayc = document.getElementById('dayc'), dayN = document.getElementById('dayN'), dayL = document.getElementById('dayL');
  let dayMode = 0, clockOffset = 0;
  // Gerçek saat: önce sayfanın geldiği sunucudan, olmazsa bir saat servisinden; ikisi de olmazsa cihaz saati.
  // Tarih her zaman Türkiye saatine (UTC+3) göre hesaplanır.
  async function syncClock(){
    try{
      const r = await fetch(location.pathname+'?t='+Date.now(), {method:'HEAD', cache:'no-store'});
      const dh = r.headers.get('Date');
      if(dh){
        const srv = Date.parse(dh) + (parseInt(r.headers.get('Age')||'0',10)||0)*1000;
        if(isFinite(srv)){ clockOffset = srv - Date.now(); return; }
      }
    }catch(e){}
    try{
      const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 5000);
      const r = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', {cache:'no-store', signal:ctl.signal});
      clearTimeout(to);
      const d = await r.json();
      if(d && d.unixtime) clockOffset = d.unixtime*1000 - Date.now();
    }catch(e){}
  }
  function dayInfo(){
    const now = new Date(Date.now() + clockOffset + 3*3600*1000), y = now.getUTCFullYear(), m = now.getUTCMonth()+1, d = now.getUTCDate();
    const n = Math.round((Date.UTC(y,m-1,d) - Date.UTC(MEET[0],MEET[1]-1,MEET[2]))/86400000) + 1;
    const today = Date.UTC(y,m-1,d);
    const addM = (k)=>{ const t = MEET[1]-1+k, yr = MEET[0]+Math.floor(t/12), mo = ((t%12)+12)%12; return Date.UTC(yr, mo, Math.min(MEET[2], new Date(yr, mo+1, 0).getDate())); };
    let tm = (y-MEET[0])*12 + (m-MEET[1]);
    if(addM(tm) > today) tm--;
    const yy = Math.floor(tm/12), mm = tm%12, dd = Math.round((today - addM(tm))/86400000);
    return {n, yy, mm, dd, anniv: (m===MEET[1] && d===MEET[2] && yy>0), mile: (n%100===0 || n===365)};
  }
  function renderDay(){
    const i = dayInfo();
    if(i.n<1){ dayc.style.display='none'; return; }
    dayc.style.display = '';
    const special = i.anniv || i.mile;
    dayc.classList.toggle('special', special);
    if(dayMode===0){
      dayN.textContent = '💗 '+i.n+'.';
      dayL.textContent = i.anniv ? 'yıl dönümü 🎉' : (i.mile ? 'gün 🎉' : 'gün');
    } else {
      const seg = [];
      if(i.yy) seg.push(i.yy+' yıl'); if(i.mm) seg.push(i.mm+' ay'); if(i.dd || !seg.length) seg.push(i.dd+' gün');
      dayN.textContent = seg.join(' ');
      dayL.textContent = 'birlikte 💗';
    }
  }
  dayc.onclick = ()=>{ dayMode = 1-dayMode; renderDay(); };
  renderDay();
  syncClock().then(renderDay);
  setInterval(renderDay, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ renderDay(); syncClock().then(renderDay); } });

  showStatus();

  (async ()=>{
    db = await openDB();
    await loadTracks();
    requestAnimationFrame(tick);
  })();
})();
</script>
