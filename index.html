  function readH(){ return {'Authorization':'Bearer '+localStorage.getItem('ghtoken'), 'Accept':'application/vnd.github+json'}; }
  async function albFail(r){
    if(r.status===404) return new Error('Albüm deposuna erişilemedi (404). “'+ALB_REPO+'” adlı özel depo açılmış ve anahtara eklenmiş olmalı.');
    return ghFail(r);
  }
  async function albList(){
    const r = await fetch(ALB_API+'/contents/thumbs', {headers:readH(), cache:'no-store'});
    if(r.status===404){
      const r2 = await fetch(ALB_API, {headers:readH(), cache:'no-store'});
      if(!r2.ok) throw await albFail(r2);
      return [];
    }
    if(!r.ok) throw await albFail(r);
    const d = await r.json();
    return d.filter(x=>x.type==='file').map(x=>x.name).sort().reverse();
  }
  async function albGetMeta(){
    const r = await fetch(ALB_API+'/contents/albums.json', {headers:readH(), cache:'no-store'});
    if(r.status===404) return {data:{folders:[], map:{}}, sha:null};
    if(!r.ok) throw await albFail(r);
    const d = await r.json();
    let data = {};
    try{ data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(String(d.content||'').replace(/\n/g,'')), c=>c.charCodeAt(0)))); }catch(e){}
    if(!Array.isArray(data.folders)) data.folders = [];
    if(!data.map || typeof data.map!=='object') data.map = {};
    return {data, sha:d.sha};
  }
  async function albUpdateMeta(mutate){
    for(let n=0;n<3;n++){
      const {data, sha} = await albGetMeta();
      mutate(data);
      const body = {message:'Albüm güncelle', content: toB64(new TextEncoder().encode(JSON.stringify(data)))};
      if(sha) body.sha = sha;
      const r = await fetch(ALB_API+'/contents/albums.json', {method:'PUT', headers:authH(), body:JSON.stringify(body)});
      if(r.ok){ albMeta = data; return; }
      if(r.status!==409 && r.status!==422) throw await albFail(r);
    }
    throw new Error('Kaydedilemedi, tekrar dene');
  }
  async function albBlob(dir, name){
    const key = 'https://album.local/'+dir+'/'+name;
    let cache = null;
    if('caches' in window){
      try{ cache = await caches.open('elif-album-v1'); const hit = await cache.match(key); if(hit) return await hit.blob(); }catch(e){ cache = null; }
    }
    const r = await fetch(ALB_API+'/contents/'+dir+'/'+encodeURIComponent(name), {headers:{'Authorization':'Bearer '+localStorage.getItem('ghtoken'), 'Accept':'application/vnd.github.raw+json'}});
    if(!r.ok) throw await albFail(r);
    const blob = new Blob([await r.arrayBuffer()], {type:'image/jpeg'});
    if(cache){ try{ await cache.put(key, new Response(blob, {headers:{'Content-Type':'image/jpeg'}})); }catch(e){} }
    return blob;
  }
  async function albUncache(name){
    if(!('caches' in window)) return;
    try{ const c = await caches.open('elif-album-v1'); await c.delete('https://album.local/thumbs/'+name); await c.delete('https://album.local/photos/'+name); }catch(e){}
  }
  function resizeJpeg(file, max, q){
    return new Promise((res, rej)=>{
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u);
        c.toBlob(b=>b ? res(b) : rej(new Error('Fotoğraf küçültülemedi')), 'image/jpeg', q);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error('Fotoğraf okunamadı')); };
      img.src = u;
    });
  }
  async function albPut(path, blob){
    const b64 = await new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(String(fr.result).split(',')[1]); fr.onerror = ()=>rej(fr.error); fr.readAsDataURL(blob); });
    const r = await fetch(ALB_API+'/contents/'+path, {method:'PUT', headers:authH(), body:JSON.stringify({message:'Fotoğraf ekle', content:b64})});
    if(!r.ok) throw await albFail(r);
  }
  async function albDelOne(path){
    const url = ALB_API+'/contents/'+path;
    const r = await fetch(url, {headers:readH(), cache:'no-store'});
    if(r.status===404) return;
    if(!r.ok) throw await albFail(r);
    const info = await r.json();
    const r2 = await fetch(url, {method:'DELETE', headers:authH(), body:JSON.stringify({message:'Fotoğraf sil', sha:info.sha})});
    if(!r2.ok) throw await albFail(r2);
  }
  async function albAct(fn){
    albMsg('Kaydediliyor…');
    try{ await fn(); albMsg(''); }
    catch(err){ if(authFail(err)){ closeAlbum(); return; } albMsg(err.message); }
    renderGrid();
  }

  // ---- görünüm: ana albüm (klasörler + klasörsüz fotoğraflar) ya da bir klasörün içi ----
  function folderById(id){ return albMeta.folders.find(f=>f.id===id); }
  function fParent(f){ return (f.parent && folderById(f.parent)) ? f.parent : null; }
  function within(fid, root){ let x = fid, g = 0; while(x && g++<30){ if(x===root) return true; const f = folderById(x); x = f ? fParent(f) : null; } return false; }
  function pathOf(id){ const p = []; let x = id, g = 0; while(x && g++<30){ const f = folderById(x); if(!f) break; p.unshift(f.name); x = fParent(f); } return p; }
  function photoFolder(nm){ const id = albMeta.map[nm]; return (id && folderById(id)) ? id : null; }
  function albRevoke(){ albUrls.forEach(u=>URL.revokeObjectURL(u)); albUrls = []; }
  function mkCell(name){
    const c = mkEl('div','alb-cell'); if(name) c.dataset.name = name;
    const img = document.createElement('img'); img.alt = ''; c.appendChild(img);
    return c;
  }
  function watchCell(c){ if(albIO) albIO.observe(c); else loadThumb(c); }
  function updateHead(){
    const f = albCur && folderById(albCur);
    albTitle.textContent = '📷 Albüm' + (f ? pathOf(f.id).map(x=>' › '+x).join('') : '');
    albTitle.title = albTitle.textContent;
    albBack.style.display = f ? '' : 'none';
    document.getElementById('albEditBtn').style.display = f ? '' : 'none';
    albFolderBtn.textContent = '＋ Klasör';
    const sb = document.getElementById('albSel'), sd = document.getElementById('albSelDel');
    sb.textContent = albSelMode ? 'Vazgeç' : 'Seç';
    sd.style.display = (albSelMode && albSelSet.size) ? '' : 'none'; sd.textContent = '🗑 Sil ('+albSelSet.size+')';
  }
  function renderGrid(){
    if(albCur && !folderById(albCur)) albCur = null;
    albRevoke(); albGrid.innerHTML = '';
    updateHead();
    if(!albIO && 'IntersectionObserver' in window){
      albIO = new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){ albIO.unobserve(e.target); loadThumb(e.target); } }), {root: albBody, rootMargin:'300px'});
    }
    viewNames = albNames.filter(n=> albCur ? photoFolder(n)===albCur : photoFolder(n)===null);
    let any = false;
    {
      albMeta.folders.filter(f=>fParent(f)===albCur).forEach(f=>{
        any = true;
        const mine = albNames.filter(n=>within(photoFolder(n), f.id));
        const c = mkCell(mine[0] || null); c.classList.add('folder');
        if(mine.length){ c.appendChild(mkEl('span','ficon','📁')); }
        else { c.classList.add('nocover'); c.firstChild.style.display = 'none'; c.appendChild(mkEl('span','bigicon','📁')); }
        c.appendChild(mkEl('div','fname', f.name+' · '+mine.length));
        c.onclick = ()=>{ albCur = f.id; albSelSet.clear(); renderGrid(); albBody.scrollTop = 0; };
        albGrid.appendChild(c);
        if(mine.length) watchCell(c);
      });
    }
    viewNames.forEach((nm, i)=>{
      any = true;
      const c = mkCell(nm);
      if(albSelMode){ c.appendChild(mkEl('span','ptk', albSelSet.has(nm)?'✓':'')); if(albSelSet.has(nm)) c.classList.add('on'); }
      c.onclick = ()=>{
        if(!albSelMode){ openViewer(i); return; }
        if(albSelSet.has(nm)) albSelSet.delete(nm); else albSelSet.add(nm);
        c.classList.toggle('on', albSelSet.has(nm)); c.querySelector('.ptk').textContent = albSelSet.has(nm) ? '✓' : ''; updateHead();
      };
      albGrid.appendChild(c); watchCell(c);
    });
    if(!any && !albLoading){
      const e = mkEl('div','alb-empty', albCur ? 'Bu klasör henüz boş.\nSağ üstteki “＋ Fotoğraf” ile ekleyebilirsin 💗' : 'Henüz fotoğraf yok.\nSağ üstteki “＋ Fotoğraf” ile başla 💗');
      e.style.whiteSpace = 'pre-line'; albGrid.appendChild(e);
    }
  }
  function loadThumb(cell){
    albBlob('thumbs', cell.dataset.name).then(b=>{
      if(!cell.isConnected) return;
      const u = URL.createObjectURL(b); albUrls.push(u); cell.firstChild.src = u;
    }).catch(()=>{});
  }
  async function openAlbum(){
    if(!hasToken()){ tokenDialog(); return; }
    albumEl.style.display = 'flex'; document.documentElement.style.overflow = 'hidden';
    albCur = null; albNames = []; albMeta = {folders:[], map:{}}; albLoading = true;
    albMsg('Yükleniyor…'); renderGrid();
    try{
      const r = await Promise.all([albList(), albGetMeta()]);
      albNames = r[0]; albMeta = r[1].data; albLoading = false; albMsg(''); renderGrid();
    }catch(err){
      albLoading = false;
      if(authFail(err)){ closeAlbum(); return; }
      albMsg(err.message); renderGrid();
    }
  }
  function closeAlbum(){
    albSelMode = false; albSelSet.clear(); closeViewer(); albumEl.style.display = 'none'; document.documentElement.style.overflow = ''; albRevoke(); albGrid.innerHTML = '';
  }

  // ---- klasör penceresi ----
  function folderDialog(f, mv, parent){
    const card = mkEl('div','card');
    card.appendChild(mkEl('h3',null, f ? 'Klasörü düzenle' : (parent && folderById(parent) ? 'Yeni klasör: '+pathOf(parent).join(' › ')+' içine' : 'Yeni klasör')));
    card.appendChild(mkEl('label',null,'Klasör adı'));
    const name = textInput('Örn. Tatil 2025', f ? f.name : ''); name.maxLength = 40;
    card.appendChild(name);
    const row = mkEl('div','row');
    const cancel = mkEl('button','btn sec','Vazgeç'); cancel.onclick = closeDlg;
    const ok = mkEl('button','btn pri', f ? 'Kaydet' : 'Oluştur');
    row.append(cancel, ok); card.appendChild(row);
    if(f){
      const del = mkEl('button','btn danger','Klasörü sil (fotoğraflar silinmez)');
      del.onclick = ()=>confirmDlg('Klasör silinsin mi?', 'Fotoğraflar ve içindeki klasörler silinmez, bir üst yere taşınır.', 'Sil', ()=>{
        albCur = fParent(f);
        albAct(()=>albUpdateMeta(m=>{
          const pid = (f.parent && m.folders.some(x=>x.id===f.parent)) ? f.parent : null;
          m.folders = m.folders.filter(x=>x.id!==f.id);
          m.folders.forEach(x=>{ if(x.parent===f.id){ if(pid) x.parent = pid; else delete x.parent; } });
          Object.keys(m.map).forEach(k=>{ if(m.map[k]===f.id){ if(pid) m.map[k] = pid; else delete m.map[k]; } });
        }));
      });
      card.appendChild(del);
    }
    ok.onclick = async ()=>{
      const n = name.value.trim();
      if(!n){ name.classList.add('bad'); name.focus(); return; }
      closeDlg();
      if(f){ albAct(()=>albUpdateMeta(m=>{ const q = m.folders.find(x=>x.id===f.id); if(q) q.name = n; })); return; }
      const id = 'f'+Date.now().toString(36);
      await albAct(()=>albUpdateMeta(m=>{ const nf = {id, name:n}; if(parent && m.folders.some(x=>x.id===parent)) nf.parent = parent; m.folders.push(nf); if(mv) m.map[mv] = id; }));
      if(mv) afterMove();
    };
    name.onkeydown = (e)=>{ name.classList.remove('bad'); if(e.key==='Enter') ok.click(); };
    showDlg(card);
  }
  function afterMove(){ if(!viewNames.length) closeViewer(); else showViewer(Math.min(vIdx, viewNames.length-1)); }
  async function movePhoto(nm, fid){
    await albAct(()=>albUpdateMeta(m=>{ if(fid) m.map[nm] = fid; else delete m.map[nm]; }));
    afterMove();
  }

  // ---- yükleme (açık klasöre) ----
  async function albUpload(files){
    if(albBusy || !files.length) return;
    albBusy = true; const target = albCur; const ids = []; let ok = 0, lastErr = '';
    for(let i=0;i<files.length;i++){
      const f = files[i]; albMsg('Yükleniyor '+(i+1)+'/'+files.length+'…');
      try{
        const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';
        const full = await resizeJpeg(f, 1600, 0.82), th = await resizeJpeg(f, 400, 0.75);
        await albPut('photos/'+id, full); await albPut('thumbs/'+id, th); ids.push(id); ok++;
      }catch(err){
        if(authFail(err)){ albBusy = false; closeAlbum(); return; }
        lastErr = f.name+': '+err.message;
      }
    }
    if(target && ids.length){
      try{ await albUpdateMeta(m=>{ ids.forEach(id=>{ m.map[id] = target; }); }); }
      catch(err){ lastErr = 'Klasöre eklenemedi, ana albümde duruyor: '+err.message; }
    }
    albBusy = false;
    try{ albNames = await albList(); }catch(e){}
    renderGrid();
    albMsg(lastErr ? ('Bazıları yüklenemedi — '+lastErr) : (ok+' fotoğraf eklendi 💗'));
  }

  // ---- klasöre, albümdeki var olan fotoğraflardan seç (ana albümde duranlar + bu klasördekiler) ----
  function openPhotoPicker(fid){
    const f = folderById(fid); if(!f) return;
    const cand = albNames.filter(n=>{ const p = photoFolder(n); return p===null || p===fid; });
    const sel = new Set(cand.filter(n=>photoFolder(n)===fid)), start = new Set(sel), urls = [];
    sheet.innerHTML = '';
    const box = mkEl('div','box pick');
    box.appendChild(mkEl('h3',null,'“'+f.name+'” için fotoğraf seç'));
    const listDiv = mkEl('div','plist'), grid = mkEl('div','pgrid'); listDiv.appendChild(grid); box.appendChild(listDiv);
    const foot = mkEl('div','pfoot'), done = mkEl('button','done'), cancel = mkEl('button','cancel','Vazgeç');
    foot.append(done, cancel); box.appendChild(foot);
    const upd = ()=>{ done.textContent = 'Bitti ('+sel.size+' seçili)'; };
    const close = ()=>{ urls.forEach(u=>URL.revokeObjectURL(u)); closeSheet(); };
    const ld = (c)=>{ albBlob('thumbs', c.dataset.name).then(b=>{ const u = URL.createObjectURL(b); urls.push(u); c.firstChild.src = u; }).catch(()=>{}); };
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); ld(e.target); } }), {root:listDiv, rootMargin:'200px'}) : null;
    if(!cand.length) grid.appendChild(mkEl('div','empty-list','Ana albümde eklenecek fotoğraf yok.'));
    cand.forEach(n=>{
      const c = mkEl('div','pcell'+(sel.has(n)?' on':'')); c.dataset.name = n;
      const img = document.createElement('img'); img.alt = ''; c.appendChild(img);
      const t = mkEl('span','ptk', sel.has(n)?'✓':''); c.appendChild(t);
      c.onclick = ()=>{ if(sel.has(n)) sel.delete(n); else sel.add(n); c.classList.toggle('on', sel.has(n)); t.textContent = sel.has(n)?'✓':''; upd(); };
      grid.appendChild(c); if(io) io.observe(c); else ld(c);
    });
    cancel.onclick = close;
    done.onclick = ()=>{
      close();
      const add = Array.from(sel).filter(n=>!start.has(n)), rem = Array.from(start).filter(n=>!sel.has(n));
      if(!add.length && !rem.length) return;
      albAct(()=>albUpdateMeta(m=>{ add.forEach(n=>{ m.map[n] = fid; }); rem.forEach(n=>{ delete m.map[n]; }); }));
    };
    upd(); sheet.appendChild(box); sheet.style.display = 'flex';
  }

  // ---- tam ekran görüntüleme ----
  function openViewer(i){ viewer.style.display = 'flex'; showViewer(i); }
  function closeViewer(){ viewer.style.display = 'none'; vImg.removeAttribute('src'); if(vUrl){ URL.revokeObjectURL(vUrl); vUrl = null; } }
  async function showViewer(i){
    if(!viewNames.length){ closeViewer(); return; }
    vIdx = (i+viewNames.length)%viewNames.length; const my = vIdx;
    vCount.textContent = (my+1)+' / '+viewNames.length; vImg.style.opacity = .3;
    try{
      const b = await albBlob('photos', viewNames[my]);
      if(vIdx!==my) return;
      if(vUrl) URL.revokeObjectURL(vUrl);
      vUrl = URL.createObjectURL(b); vImg.src = vUrl; vImg.style.opacity = 1;
      if(viewNames.length>1) albBlob('photos', viewNames[(my+1)%viewNames.length]).catch(()=>{});
    }catch(err){ vCount.textContent = err.message; }
  }
  document.getElementById('albBtn').onclick = openAlbum;
  document.getElementById('albClose').onclick = closeAlbum;
  albBack.onclick = ()=>{ albSelSet.clear(); const cf = albCur && folderById(albCur); albCur = cf ? fParent(cf) : null; renderGrid(); albBody.scrollTop = 0; };
  albFolderBtn.onclick = ()=>folderDialog(null, null, albCur);
  document.getElementById('albEditBtn').onclick = ()=>{ const f = albCur && folderById(albCur); if(f) folderDialog(f); };
  document.getElementById('albAdd').onclick = ()=>{
    if(albBusy) return;
    const f = albCur && folderById(albCur), fi = document.getElementById('albFile');
    if(!f){ fi.click(); return; }
    openSheet('Fotoğraf ekle', [['Albümdeki var olanlardan seç', ()=>openPhotoPicker(f.id)], ['Yeni fotoğraf yükle', ()=>fi.click()]]);
  };
  document.getElementById('albSel').onclick = ()=>{ albSelMode = !albSelMode; albSelSet.clear(); renderGrid(); };
  document.getElementById('albSelDel').onclick = ()=>{
    const names = Array.from(albSelSet); if(!names.length) return;
    confirmDlg(names.length+' fotoğraf silinsin mi?', 'Albümden silinir, ikinizde de kalkar. Bu işlem geri alınamaz.', 'Sil', ()=>albAct(async ()=>{
      for(let i=0;i<names.length;i++){
        const nm = names[i]; albMsg('Siliniyor '+(i+1)+'/'+names.length+'…');
        await albDelOne('thumbs/'+nm); await albDelOne('photos/'+nm); await albUncache(nm);
        albNames = albNames.filter(x=>x!==nm); albSelSet.delete(nm);
      }
      try{ await albUpdateMeta(m=>{ names.forEach(n=>{ delete m.map[n]; }); }); }catch(e){}
      albSelMode = false; albSelSet.clear();
    }));
  };
  document.getElementById('albFile').onchange = (e)=>{ const fs = Array.from(e.target.files); e.target.value = ''; albUpload(fs); };
  document.getElementById('vClose').onclick = closeViewer;
  document.getElementById('vPrev').onclick = ()=>showViewer(vIdx-1);
  document.getElementById('vNext').onclick = ()=>showViewer(vIdx+1);
  document.getElementById('vMove').onclick = ()=>{
    const nm = viewNames[vIdx]; if(!nm) return;
    const cur = photoFolder(nm), items = [];
    if(cur) items.push(['Ana albüme al', ()=>movePhoto(nm, null)]);
    albMeta.folders.map(f=>[pathOf(f.id).join(' › '), f.id]).sort((a,b)=>a[0].localeCompare(b[0],'tr')).forEach(([lb,id])=>{ if(id!==cur) items.push(['📁 '+lb, ()=>movePhoto(nm, id)]); });
    items.push(['＋ Yeni klasör', ()=>folderDialog(null, nm, albCur)]);
    openSheet('Nereye taşınsın?', items);
  };
  document.getElementById('vDel').onclick = ()=>{
    const nm = viewNames[vIdx]; if(!nm) return;
    confirmDlg('Fotoğraf silinsin mi?', 'Albümden silinir, ikinizde de kalkar. Bu işlem geri alınamaz.', 'Sil', async ()=>{
      try{
        albMsg('Siliniyor…');
        await albDelOne('thumbs/'+nm); await albDelOne('photos/'+nm); await albUncache(nm);
        albNames = albNames.filter(x=>x!==nm);
        if(albMeta.map[nm]){ try{ await albUpdateMeta(m=>{ delete m.map[nm]; }); }catch(e){} }
        renderGrid(); albMsg('');
        afterMove();
      }catch(err){ if(authFail(err)){ closeAlbum(); return; } albMsg(err.message); }
    });
  };
  let tx0 = null;
  viewer.addEventListener('touchstart', (e)=>{ tx0 = e.touches[0].clientX; }, {passive:true});
  viewer.addEventListener('touchend', (e)=>{
    if(tx0===null) return; const dx = e.changedTouches[0].clientX - tx0; tx0 = null;
    if(Math.abs(dx)>50) showViewer(vIdx + (dx<0 ? 1 : -1));
  }, {passive:true});
  document.addEventListener('keydown', (e)=>{
    if(viewer.style.display==='flex'){
      if(e.key==='ArrowLeft') showViewer(vIdx-1); else if(e.key==='ArrowRight') showViewer(vIdx+1); else if(e.key==='Escape') closeViewer();
    } else if(albumEl.style.display==='flex' && e.key==='Escape') closeAlbum();
  });

  // --- Kim ne dinledi (özel depoda listening.json, herkes sadece kendi kaydını yazar) ---
  const LFILE = '/contents/listening.json', NAMES = {elif:'Elif', berke:'Berke'};
  function who(){ try{ const w = localStorage.getItem('who'); return NAMES[w] ? w : null; }catch(e){ return null; } }
  function whoDialog(after){
    const card = mkEl('div','card');
    card.appendChild(mkEl('h3',null,'Kim dinliyor?'));
    card.appendChild(mkEl('p','hint','Son dinlenenler böyle ayırt edilecek. Sonradan “Son dinlenen” penceresinden değiştirebilirsin.'));
    const row = mkEl('div','row');
    ['elif','berke'].forEach(k=>{ const b = mkEl('button','btn pri',NAMES[k]); b.onclick = ()=>{ try{ localStorage.setItem('who',k); }catch(e){} closeDlg(); if(after) after(); }; row.appendChild(b); });
    card.appendChild(row); showDlg(card);
  }
  async function getListen(){
    const r = await fetch(ALB_API+LFILE, {headers:readH(), cache:'no-store'});
    if(r.status===404) return {data:{}, sha:null};
    if(!r.ok) throw await albFail(r);
    const d = await r.json();
    let data = {}; try{ data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(String(d.content||'').replace(/\n/g,'')), c=>c.charCodeAt(0)))); }catch(e){}
    if(!data || typeof data!=='object') data = {};
    return {data, sha:d.sha};
  }
  async function logListen(name){
    const w = who(); if(!w || !hasToken()) return;
    try{
      for(let n=0;n<3;n++){
        const {data, sha} = await getListen();
        const arr = (Array.isArray(data[w]) ? data[w] : []).filter(x=>x.n!==name);
        arr.unshift({n:name, t:Date.now()}); data[w] = arr.slice(0,5);
        const body = {message:'Son dinlenen', content: toB64(new TextEncoder().encode(JSON.stringify(data)))};
        if(sha) body.sha = sha;
        const r = await fetch(ALB_API+LFILE, {method:'PUT', headers:authH(), body:JSON.stringify(body)});
        if(r.ok || (r.status!==409 && r.status!==422)) return;
      }
    }catch(e){}
  }
  function timeAgo(ts){ const m = Math.round((Date.now()-ts)/60000); if(m<1) return 'az önce'; if(m<60) return m+' dk önce'; const h = Math.round(m/60); return h<24 ? h+' saat önce' : Math.round(h/24)+' gün önce'; }
  function lastDialog(){
    if(!hasToken()){ tokenDialog(); return; }
    if(!who()){ whoDialog(lastDialog); return; }
    const me = who(); let sel = me==='elif' ? 'berke' : 'elif', data = null;
    const card = mkEl('div','card');
    card.appendChild(mkEl('h3',null,'Son dinlenen'));
    const tabs = mkEl('div','row'), body = mkEl('div','lastlist');
    const paint = ()=>{
      tabs.innerHTML = '';
      ['elif','berke'].forEach(k=>{ const b = mkEl('button','btn '+(k===sel?'pri':'sec'), NAMES[k]+(k===me?' (sen)':'')); b.onclick = ()=>{ sel = k; paint(); }; tabs.appendChild(b); });
      body.innerHTML = '';
      if(!data){ body.textContent = 'Yükleniyor…'; return; }
      const arr = Array.isArray(data[sel]) ? data[sel] : [];
      if(!arr.length){ body.textContent = 'Henüz kayıt yok.'; return; }
      arr.forEach((x,i)=>{ const r = mkEl('div','lrow'); r.appendChild(mkEl('span','ln',(i+1)+'. '+x.n)); r.appendChild(mkEl('span','lt',timeAgo(x.t))); body.appendChild(r); });
    };
    paint();
    const row = mkEl('div','row');
    const chg = mkEl('button','btn sec','Ben '+NAMES[me]+' değilim'); chg.onclick = ()=>whoDialog(lastDialog);
    const cl = mkEl('button','btn pri','Kapat'); cl.onclick = closeDlg;
    row.append(chg, cl);
    card.append(tabs, body, row); showDlg(card);
    getListen().then(r=>{ data = r.data; paint(); }).catch(err=>{ if(authFail(err)) return; body.textContent = err.message; });
  }
  document.getElementById('lastBtn').onclick = lastDialog;

  // --- Kim en son ne zaman buradaydı (özel depoda presence-elif.json / presence-berke.json, herkes sadece kendi dosyasını yazar) ---
  const PP = '/contents/presence-', presEl = document.getElementById('presence');
  let presSha, presLast = 0;
  async function presGetSha(w){
    const r = await fetch(ALB_API+PP+w+'.json', {headers:readH(), cache:'no-store'});
    if(r.ok){ presSha = (await r.json()).sha; return true; }
    if(r.status===404){ presSha = null; return true; }
    return false;
  }
  async function presWrite(ka){
    const w = who(); if(!w || !hasToken()) return;
    const now = Date.now(); if(now-presLast < 20000) return; presLast = now;
    try{
      if(presSha===undefined && !(await presGetSha(w))) return;
      for(let n=0;n<2;n++){
        const body = {message:'Burada', content: toB64(new TextEncoder().encode(JSON.stringify({t:Date.now()})))};
        if(presSha) body.sha = presSha;
        const r = await fetch(ALB_API+PP+w+'.json', {method:'PUT', headers:authH(), body:JSON.stringify(body), keepalive:!!ka});
        if(r.ok){ presSha = (await r.json()).content.sha; return; }
        if(r.status===409 || r.status===422){ if(!(await presGetSha(w))) return; continue; }
        return;
      }
    }catch(e){}
  }
  async function presRead(){
    const w = who(); if(!w || !hasToken()){ presEl.textContent=''; return; }
    const o = w==='elif' ? 'berke' : 'elif';
    try{
      const r = await fetch(ALB_API+PP+o+'.json', {headers:readH(), cache:'no-store'});
      if(r.status===404){ presEl.textContent = '💞 '+NAMES[o]+' henüz kayıt bırakmadı'; return; }
      if(!r.ok) return;
      const d = await r.json();
      const t = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(String(d.content||'').replace(/\n/g,'')), c=>c.charCodeAt(0)))).t;
      if(!t) return;
      const m = Math.round((Date.now()-t)/60000);
      presEl.textContent = m<2 ? '💞 '+NAMES[o]+' az önce buradaydı' : '💞 '+NAMES[o]+' en son '+timeAgo(t)+' buradaydı';
    }catch(e){}
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden') presWrite(true);
    else { presWrite(); presRead(); }
  });
  window.addEventListener('pagehide', ()=>{ presWrite(true); });
  setInterval(()=>{ if(document.visibilityState==='visible') presRead(); }, 60000);
  presWrite(); presRead();
  document.getElementById('q').oninput = (e)=>{ qTerm = e.target.value.trim().toLocaleLowerCase('tr'); renderList(); };

  // --- Gün sayacı (gerçek tarihe bağlı, her gün kendiliğinden artar) ---
  const MEET = [2022, 7, 31];   // tanıştığınız gün: yıl, ay, gün (o gün 1. gün sayılır)
  const dayc = document.getElementById('dayc'), dayN = document.getElementById('dayN'), dayL = document.getElementById('dayL');
  let dayMode = 0, clockOffset = 0;
  // Gerçek saat: önce sayfanın geldiği sunucudan, olmazsa bir saat servisinden; ikisi de olmazsa cihaz saati.
  // Tarih her zaman Türkiye saatine (UTC+3) göre hesaplanır.
  async function syncClock(){
    try{
      const r = await fetch(location.pathname+'?t='+Date.now(), {method:'HEAD', cache:'no-store'});
      const dh = r.headers.get('Date');
      if(dh){
        const srv = Date.parse(dh) + (parseInt(r.headers.get('Age')||'0',10)||0)*1000;
        if(isFinite(srv)){ clockOffset = srv - Date.now(); return; }
      }
    }catch(e){}
    try{
      const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 5000);
      const r = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', {cache:'no-store', signal:ctl.signal});
      clearTimeout(to);
      const d = await r.json();
      if(d && d.unixtime) clockOffset = d.unixtime*1000 - Date.now();
    }catch(e){}
  }
  function dayInfo(){
    const now = new Date(Date.now() + clockOffset + 3*3600*1000), y = now.getUTCFullYear(), m = now.getUTCMonth()+1, d = now.getUTCDate();
    const n = Math.round((Date.UTC(y,m-1,d) - Date.UTC(MEET[0],MEET[1]-1,MEET[2]))/86400000) + 1;
    const today = Date.UTC(y,m-1,d);
    const addM = (k)=>{ const t = MEET[1]-1+k, yr = MEET[0]+Math.floor(t/12), mo = ((t%12)+12)%12; return Date.UTC(yr, mo, Math.min(MEET[2], new Date(yr, mo+1, 0).getDate())); };
    let tm = (y-MEET[0])*12 + (m-MEET[1]);
    if(addM(tm) > today) tm--;
    const yy = Math.floor(tm/12), mm = tm%12, dd = Math.round((today - addM(tm))/86400000);
    return {n, yy, mm, dd, anniv: (m===MEET[1] && d===MEET[2] && yy>0), mile: (n%100===0 || n===365)};
  }
  function renderDay(){
    const i = dayInfo();
    if(i.n<1){ dayc.style.display='none'; return; }
    dayc.style.display = '';
    const special = i.anniv || i.mile;
    dayc.classList.toggle('special', special);
    if(dayMode===0){
      dayN.textContent = '💗 '+i.n+'.';
      dayL.textContent = i.anniv ? 'yıl dönümü 🎉' : (i.mile ? 'gün 🎉' : 'gün');
    } else {
      const seg = [];
      if(i.yy) seg.push(i.yy+' yıl'); if(i.mm) seg.push(i.mm+' ay'); if(i.dd || !seg.length) seg.push(i.dd+' gün');
      dayN.textContent = seg.join(' ')+' olmuş 💗';
      dayL.textContent = '';
    }
  }
  dayc.onclick = ()=>{ dayMode = 1-dayMode; renderDay(); };
  renderDay();
  syncClock().then(renderDay);
  setInterval(renderDay, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ renderDay(); syncClock().then(renderDay); } });

  const volEl = document.getElementById('vol'), volIcon = document.getElementById('volIcon');
  audio.volume = .5;
  if(Math.abs(audio.volume-.5) > .01){ document.getElementById('volRow').style.display = 'none'; }   // iPhone ses seviyesini sayfadan ayarlatmaz
  else {
    let sv = 1; try{ const q = localStorage.getItem('volume'); if(q!==null && isFinite(+q)) sv = Math.min(1, Math.max(0, +q)); }catch(e){}
    const paintVol = ()=>{ const v = audio.volume; volEl.value = Math.round(v*100); volIcon.textContent = v===0 ? '🔇' : (v<.5 ? '🔉' : '🔊'); };
    audio.volume = sv; paintVol();
    volEl.oninput = ()=>{ audio.volume = volEl.value/100; paintVol(); try{ localStorage.setItem('volume', String(audio.volume)); }catch(e){} };
  }

  // --- Ana ekrana ekleme ---
  if('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  let installEv = null;
  window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); installEv = e; });
  const instBtn = document.getElementById('instBtn');
  if((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone) instBtn.parentNode.style.display = 'none';
  instBtn.onclick = async ()=>{
    if(installEv){ const ev = installEv; installEv = null; ev.prompt(); try{ await ev.userChoice; }catch(e){} return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const card = mkEl('div','card'); card.appendChild(mkEl('h3',null,'Ana ekrana ekle'));
    card.appendChild(mkEl('p','hint', ios
      ? 'Safari’de alttaki Paylaş düğmesine (kare ve yukarı ok) dokun, aşağı kaydırıp “Ana Ekrana Ekle”yi seç, sonra “Ekle”ye bas. Bunu Safari’den yapmalısın, başka tarayıcıda bu seçenek çıkmaz.'
      : 'Chrome’da sağ üstteki ⋮ menüsüne dokun, “Ana ekrana ekle” ya da “Uygulamayı yükle”yi seç, sonra “Ekle”ye bas.'));
    const row = mkEl('div','row'), ok = mkEl('button','btn pri','Tamam'); ok.onclick = closeDlg; row.appendChild(ok); card.appendChild(row); showDlg(card);
  };

  showStatus();

  (async ()=>{
    db = await openDB();
    await loadTracks();
    requestAnimationFrame(tick);
    if(!who()) whoDialog();
  })();
})();
</script>
</body>
